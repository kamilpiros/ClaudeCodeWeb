<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<title>Wer zahlt? · Dönerfriitig</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-start; gap: 16px; padding: max(64px, calc(env(safe-area-inset-top) + 56px)) 16px 24px; }
  .wheelBox { position: relative; width: min(86vw, 360px); height: min(86vw, 360px); }
  #wheel { width: 100%; height: 100%; display: block; touch-action: manipulation; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 26px solid var(--blue2); filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); z-index: 3;
  }
  .hubBtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 92px; height: 92px; border-radius: 50%; border: 4px solid #0a1120;
    background: linear-gradient(145deg, #4aa4ff, #2b7fe0); color: #fff;
    font-size: 15px; font-weight: 900; cursor: pointer; z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .hubBtn:active { transform: translate(-50%, -50%) scale(.94); }
  .hubBtn[disabled] { opacity: .6; }
  .result {
    min-height: 64px; text-align: center; font-size: 24px; font-weight: 800; color: var(--cream);
    max-width: 340px; line-height: 1.3;
  }
  .result .small { display: block; font-size: 13px; font-weight: 600; opacity: .65; margin-top: 5px; }
  .hint { font-size: 13px; opacity: .5; }
</style>
</head>
<body>
<a class="back" href="index.html">‹ Menü</a>
<button class="mute" id="muteBtn" title="Sound">On</button>
<canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:50"></canvas>
<div class="wrap">
  <div>
    <h1 style="font-size:26px;margin-top:4px">Wer zahlt?</h1>
    <div class="sub" style="text-align:center">Dönerfriitig</div>
  </div>
  <div class="wheelBox">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
    <button class="hubBtn" id="spinBtn">DREHEN</button>
  </div>
  <div class="result" id="result">Dreh am Rad.</div>
  <div class="hint">Aufs Rad oder den Knopf drücken.</div>
</div>

<script src="audio.js"></script>
<script>
const segments = ["CBO", "SJU", "PKN", "YMI", "MST/MSO", "JWU 🥒"];
// Zürich-Palette: Blau-Weiss alternierend
const COLORS = ["#1f4e8c", "#eef4fb", "#3b9dff", "#dfe9f5", "#0d47a1", "#7cc4ff"];
const LABEL_COL = ["#eef4fb", "#12294a", "#0a1a33", "#12294a", "#eef4fb", "#0a1a33"];

function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch {} }

// ---- Konfetti ----
const confCanvas = document.getElementById("confetti");
const cctx = confCanvas.getContext("2d");
let confParts = [], confRaf = null, confDPR = 1;
function sizeConfetti() {
  confDPR = Math.min(window.devicePixelRatio || 1, 2);
  confCanvas.width = window.innerWidth * confDPR;
  confCanvas.height = window.innerHeight * confDPR;
  cctx.setTransform(confDPR, 0, 0, confDPR, 0, 0);
}
sizeConfetti();
window.addEventListener("resize", sizeConfetti);
function burstConfetti() {
  const w = window.innerWidth, ox = w / 2, oy = window.innerHeight * 0.32;
  const pal = COLORS.concat(["#ffffff"]);
  for (let i = 0; i < 150; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 4 + Math.random() * 9;
    confParts.push({
      x: ox + (Math.random() - 0.5) * 60, y: oy,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 4,
      g: 0.16 + Math.random() * 0.1, size: 5 + Math.random() * 7,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
      color: pal[(Math.random() * pal.length) | 0], life: 0, max: 90 + Math.random() * 50,
    });
  }
  if (!confRaf) confRaf = requestAnimationFrame(confStep);
}
function confStep() {
  cctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  confParts = confParts.filter(p => p.life < p.max && p.y < window.innerHeight + 40);
  for (const p of confParts) {
    p.life++; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
    cctx.fillStyle = p.color; cctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    cctx.restore();
  }
  if (confParts.length) confRaf = requestAnimationFrame(confStep);
  else { confRaf = null; cctx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
}

// ---- Rad ----
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
let SIZE = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SIZE = canvas.clientWidth;
  canvas.width = SIZE * DPR; canvas.height = SIZE * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}
window.addEventListener("resize", resize);

let rot = 0, vel = 0, spinning = false, lastIdx = -1;
const pointerA = -Math.PI / 2;

function winnerIndex() {
  const n = segments.length, seg = (Math.PI * 2) / n;
  let rel = (pointerA - rot) % (Math.PI * 2);
  if (rel < 0) rel += Math.PI * 2;
  return Math.floor(rel / seg) % n;
}

function draw() {
  const n = segments.length, seg = (Math.PI * 2) / n;
  const cx = SIZE / 2, cy = SIZE / 2, R = SIZE / 2 - 4;
  ctx.clearRect(0, 0, SIZE, SIZE);
  for (let i = 0; i < n; i++) {
    const a0 = rot + i * seg, a1 = a0 + seg;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
    ctx.strokeStyle = "rgba(6,12,24,.5)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(a0 + seg / 2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = LABEL_COL[i % LABEL_COL.length];
    ctx.font = `800 ${Math.max(13, SIZE * 0.055)}px "Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive`;
    ctx.fillText(segments[i], R - 16, 0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.strokeStyle = "#0a1120"; ctx.lineWidth = 6; ctx.stroke();
}

const spinBtn = document.getElementById("spinBtn");
const resultEl = document.getElementById("result");
function spin() {
  if (spinning) return;
  DFAudio.unlock();
  spinning = true; spinBtn.disabled = true;
  resultEl.textContent = "…";
  DFAudio.spin();
  vel = 0.32 + Math.random() * 0.16;
  lastIdx = winnerIndex();
  requestAnimationFrame(step);
}
function step() {
  rot += vel; vel *= 0.985;
  if (vel < 0.0025) {
    rot += vel; vel *= 0.9;
    if (vel < 0.0008) { finish(); draw(); return; }
  }
  const idx = winnerIndex();
  if (idx !== lastIdx) { lastIdx = idx; DFAudio.tick(); }
  draw();
  requestAnimationFrame(step);
}
function finish() {
  spinning = false; spinBtn.disabled = false;
  const wi = winnerIndex();
  resultEl.innerHTML = `${segments[wi]} zahlt!<span class="small">Trostpflaster für die Vereinskasse.</span>`;
  DFAudio.win();
  vibrate([0, 40, 50, 40, 50, 90]);
  burstConfetti();
}
spinBtn.onclick = spin;
canvas.addEventListener("pointerdown", spin);

// ---- Sound ----
const muteBtn = document.getElementById("muteBtn");
let muted = localStorage.getItem("df_muted") === "1";
function paintMute() { muteBtn.textContent = muted ? "Off" : "On"; }
paintMute();
function startAudio() {
  DFAudio.unlock(); DFAudio.setMuted(muted);
  if (!muted) DFAudio.startMusic();
  window.removeEventListener("pointerdown", startAudio);
}
window.addEventListener("pointerdown", startAudio);
muteBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  muted = DFAudio.toggleMute();
  localStorage.setItem("df_muted", muted ? "1" : "0");
  paintMute(); if (!muted) DFAudio.startMusic();
});

resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
</script>
</body>
</html>
