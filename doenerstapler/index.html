<!DOCTYPE html>
<html lang="gsw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<title>Dönerfriitig — Games</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<style>
  .games { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  .game-card {
    display: flex; align-items: center; gap: 16px; text-align: left;
    padding: 18px; border-radius: 18px; background: #261b0d; border: 1.5px solid #3a2c14;
    cursor: pointer; transition: transform .08s, border-color .15s; color: var(--cream);
    text-decoration: none;
  }
  .game-card:active { transform: scale(.97); }
  .game-card .ico { font-size: 40px; flex: 0 0 auto; }
  .game-card .t { font-size: 19px; font-weight: 800; color: var(--gold2); }
  .game-card .d { font-size: 13px; opacity: .75; margin-top: 2px; line-height: 1.4; }
</style>
</head>
<body>
<button class="mute" id="muteBtn" title="Sound">🔊</button>
<div class="screen">
  <div class="logo"><img src="logo.png" alt="DF" onerror="this.parentNode.textContent='🥙'"></div>
  <div>
    <h1>Dönerfriitig</h1>
    <div class="sub">Games</div>
  </div>
  <p class="lead">Wähl es Spiel. Mit Sound am beschte. 🎧🌴</p>
  <div class="games">
    <a class="game-card" href="stapler.html">
      <span class="ico">🥙</span>
      <span><span class="t">Döner-Stapler</span><span class="d">Stapel d'Zutate, knack de Highscore. Geteilti Bestenliste.</span></span>
    </a>
    <a class="game-card" href="gluecksrad.html">
      <span class="ico">🎰</span>
      <span><span class="t">Bussen-Glücksrad</span><span class="d">Rad dräihe: Bussen verteile oder uslose wer zahlt.</span></span>
    </a>
  </div>
</div>
<script src="audio.js"></script>
<script>
  const muteBtn = document.getElementById("muteBtn");
  let muted = localStorage.getItem("df_muted") === "1";
  function paintMute() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  paintMute();
  function startAudio() {
    DFAudio.unlock();
    DFAudio.setMuted(muted);
    if (!muted) DFAudio.startMusic();
    window.removeEventListener("pointerdown", startAudio);
  }
  window.addEventListener("pointerdown", startAudio);
  muteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    muted = DFAudio.toggleMute();
    localStorage.setItem("df_muted", muted ? "1" : "0");
    paintMute();
    if (!muted) DFAudio.startMusic();
  });
</script>
</body>
</html>
