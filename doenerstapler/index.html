<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c386d">
<title>Dönerfriitig</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  .hero {
    min-height: 100svh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 20px; text-align: center;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
    max-width: 460px; margin: 0 auto;
  }
  .hero .logo { width: 148px; height: 148px; }
  .hero h1 { font-size: 38px; letter-spacing: .5px; }

  /* Countdown */
  .cd {
    width: 100%; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 18px; padding: 15px 18px;
  }
  .cd .lbl { font-size: 12px; opacity: .6; letter-spacing: 1.5px; text-transform: uppercase; }
  .cd .units { display: flex; justify-content: center; gap: 8px; margin-top: 9px; }
  .cd .u { flex: 1; max-width: 78px; }
  .cd .u b {
    display: block; font-size: 27px; font-weight: 800; color: var(--blue2); line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .cd .u span { font-size: 10.5px; opacity: .55; letter-spacing: .5px; text-transform: uppercase; }
  .cd.now { border-color: #4caf50; }
  .cd.now .big { font-size: 20px; font-weight: 800; color: #7ee287; margin-top: 4px; }

  /* Zwei Eingänge */
  .gates { display: grid; gap: 12px; width: 100%; }
  .gate {
    display: flex; align-items: center; gap: 15px; text-align: left; text-decoration: none;
    padding: 19px; border-radius: 18px; background: var(--card);
    border: 1.5px solid var(--line); color: var(--cream);
    transition: transform .09s, border-color .15s; position: relative; overflow: hidden;
  }
  .gate:active { transform: scale(.975); }
  .gate .ico { flex: 0 0 auto; width: 46px; height: 46px; }
  .gate .t { display: block; font-size: 19px; font-weight: 800; }
  .gate .d { display: block; font-size: 12.5px; opacity: .65; margin-top: 3px; line-height: 1.4; }
  .gate .arrow { margin-left: auto; opacity: .4; font-size: 22px; flex: 0 0 auto; }
  .gate.stats { border-color: rgba(124,196,255,.4); }
  .gate.games { border-color: rgba(255,209,102,.35); }

  /* Kennzahlen-Leiste */
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; width: 100%; }
  .fact { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 11px 8px; }
  .fact b { display: block; font-size: 18px; font-weight: 800; color: var(--blue2); font-variant-numeric: tabular-nums; }
  .fact span { font-size: 10.5px; opacity: .55; line-height: 1.3; display: block; margin-top: 2px; }
  .foot { font-size: 11px; opacity: .38; margin-top: 2px; }
</style>
</head>
<body>
<div class="hero">
  <div class="logo"><img src="logo.png" alt="Dönerfriitig" onerror="this.parentNode.textContent='DF'"></div>
  <h1>Dönerfriitig</h1>

  <div class="cd" id="cd">
    <div class="lbl" id="cdLabel">Nächster Dönerfriitig</div>
    <div id="cdBody"></div>
  </div>

  <div class="gates">
    <a class="gate stats" href="stats.html">
      <svg class="ico" viewBox="0 0 44 44" fill="none" aria-hidden="true">
        <rect x="4" y="24" width="9" height="16" rx="3" fill="#7cc4ff"/>
        <rect x="17.5" y="14" width="9" height="26" rx="3" fill="#2ee6a8"/>
        <rect x="31" y="6" width="9" height="34" rx="3" fill="#ffd166"/>
      </svg>
      <span><span class="t">Anwesenheitsstatistiken</span>
      <span class="d">Ewige Rangliste, jedes Vereinsjahr, Bussen, Serien und Rekorde.</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="gate games" href="games.html">
      <svg class="ico" viewBox="0 0 44 44" fill="none" aria-hidden="true">
        <path d="M8 30c-2-8 3-14 14-14s16 6 14 14c-1 4-5 5-7 2l-2-3H17l-2 3c-2 3-6 2-7-2z" fill="#ffd166"/>
        <rect x="12" y="21" width="7" height="2.6" rx="1.3" fill="#2c386d"/>
        <rect x="14.2" y="18.8" width="2.6" height="7" rx="1.3" fill="#2c386d"/>
        <circle cx="28" cy="21" r="2" fill="#2c386d"/><circle cx="32" cy="24.5" r="2" fill="#2c386d"/>
      </svg>
      <span><span class="t">Dönerfriitig Games</span>
      <span class="d">Döner-Dash, Döner-Stapler und das Rad, das entscheidet wer zahlt.</span></span>
      <span class="arrow">›</span>
    </a>
  </div>

  <div class="facts" id="facts"></div>
  <div class="foot" id="foot"></div>
</div>

<script src="df-data.js"></script>
<script>
// ---------- Countdown auf Freitag 12.15 Uhr ----------
const cd = document.getElementById("cd");
const cdBody = document.getElementById("cdBody");
const cdLabel = document.getElementById("cdLabel");
const pad = (n) => String(n).padStart(2, "0");

function tick() {
  const now = new Date();
  const fri = new Date(now);
  fri.setHours(12, 15, 0, 0);
  fri.setDate(now.getDate() + ((5 - now.getDay() + 7) % 7));
  const end = new Date(fri.getTime() + 75 * 60000);

  if (now >= fri && now <= end) {
    cd.classList.add("now");
    cdLabel.textContent = "Es ist so weit";
    cdBody.innerHTML = '<div class="big">Jetzt ist Dönerfriitig. Guten Appetit!</div>';
    return;
  }
  cd.classList.remove("now");
  cdLabel.textContent = "Nächster Dönerfriitig";
  const target = now > end ? new Date(fri.getTime() + 7 * 86400000) : fri;
  let s = Math.max(0, Math.floor((target - now) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  cdBody.innerHTML = `<div class="units">
    <div class="u"><b>${d}</b><span>Tage</span></div>
    <div class="u"><b>${pad(h)}</b><span>Std</span></div>
    <div class="u"><b>${pad(m)}</b><span>Min</span></div>
    <div class="u"><b>${pad(s)}</b><span>Sek</span></div></div>`;
}
tick(); setInterval(tick, 1000);

// ---------- Kennzahlen aus dem Statistik-Datensatz ----------
const D = window.DF_DATA;
if (D) {
  const nf = (v) => Math.round(v).toLocaleString("de-CH");
  const last = D.years[D.years.length - 1];
  const leader = D.current.slice().sort((a, b) => D.alltime[b].att - D.alltime[a].att)[0];
  document.getElementById("facts").innerHTML = `
    <div class="fact"><b>${D.totalEvents}</b><span>Dönerfriitige<br>seit 2016</span></div>
    <div class="fact"><b>${D.years.length}</b><span>Vereins-<br>jahre</span></div>
    <div class="fact"><b>${leader}</b><span>führt die ewige<br>Rangliste</span></div>`;
  const dmy = (iso) => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
  document.getElementById("foot").textContent =
    `Vereinsjahr ${last.year} · Stand ${dmy(last.end)}`;
}
</script>
</body>
</html>
