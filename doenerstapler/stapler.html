<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<title>Döner-Stapler · Dönerfriitig</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  canvas { display: block; flex: 1 1 auto; width: 100%; touch-action: none; }
  #hud {
    position: absolute; top: 0; left: 96px; right: 64px;
    padding: max(14px, env(safe-area-inset-top)) 0 10px;
    display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 5;
  }
  #score { font-size: 52px; font-weight: 900; color: var(--gold2); text-shadow: 0 2px 10px rgba(0,0,0,.6); line-height: 1; }
  #who, #best { font-size: 13px; opacity: .7; text-align: right; }
  #tapHint {
    position: absolute; bottom: 14%; left: 0; right: 0; text-align: center;
    font-size: 16px; opacity: .75; letter-spacing: 1px; animation: pulse 1.3s ease-in-out infinite; pointer-events: none; z-index: 5;
  }
  #combo {
    position: absolute; top: 30%; left: 0; right: 0; text-align: center;
    font-size: 26px; font-weight: 900; color: var(--green);
    text-shadow: 0 2px 10px rgba(0,0,0,.6); pointer-events: none; z-index: 6;
  }
  @keyframes comboPop { 0%{transform:scale(.6);opacity:0} 40%{transform:scale(1.15);opacity:1} 100%{transform:scale(1);opacity:1} }
  #toast {
    position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%);
    background: rgba(8,14,26,.92); color: var(--cream); border: 1px solid #2a4d80;
    padding: 10px 18px; border-radius: 12px; font-size: 14px; z-index: 30; white-space: nowrap;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:.9} }
  .big { font-size: 44px; font-weight: 900; color: var(--gold2); margin: 0; }
  .bussen { color: var(--red); font-weight: 700; }
  .board { width: 100%; max-width: 360px; }
  .row { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 12px; background: #101c33; margin-bottom: 7px; font-size: 16px; }
  .row.me { background: #16294a; border: 1px solid var(--blue); }
  .row .rank { font-weight: 800; opacity: .6; }
  .row .name { font-weight: 700; }
  .row .pts { font-weight: 800; color: var(--gold2); }
  .row.gold .rank { color: var(--blue2); opacity: 1; }
  .muted { opacity: .55; font-size: 13px; margin: 6px 0; }
</style>
</head>
<body>
<a class="back" href="index.html">‹ Menü</a>
<button class="mute" id="muteBtn" title="Sound">On</button>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">
    <div id="score">0</div>
    <div><div id="who"></div><div id="best"></div></div>
  </div>
  <div id="tapHint" class="hidden">Tippe zum Stapeln</div>
  <div id="combo" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <div id="startScreen" class="screen">
    <div class="logo"><img src="logo.png" alt="DF" onerror="this.parentNode.textContent='DF'"></div>
    <div><h1>Döner-Stapler</h1><div class="sub">Dönerfriitig</div></div>
    <p class="lead">Stapel die Zutaten aufeinander: tippe im richtigen Moment, sonst wird abgeschnitten. Wer am höchsten stapelt, gewinnt.</p>
    <div style="font-size:13px;opacity:.7">Wähl dein Member-Kürzel:</div>
    <div class="members" id="members"></div>
    <button class="btn" id="playBtn" disabled>Spiele</button>
    <button class="btn ghost" id="boardBtn" style="padding:10px 22px;font-size:14px">Bestenliste</button>
  </div>

  <div id="overScreen" class="screen hidden">
    <div class="sub">Game Over</div>
    <p class="big" id="finalScore">0</p>
    <p class="lead" id="overMsg"></p>
    <div id="newBest" class="hidden" style="color:var(--green);font-weight:800">Neue persönliche Bestleistung!</div>
    <button class="btn" id="againBtn">Nochmal</button>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" id="shareBtn" style="padding:10px 22px;font-size:14px">Teilen</button>
      <button class="btn ghost" id="overBoardBtn" style="padding:10px 22px;font-size:14px">Bestenliste</button>
    </div>
    <button class="btn ghost" id="changeBtn" style="padding:8px 18px;font-size:13px">Member wechseln</button>
  </div>

  <div id="boardScreen" class="screen hidden">
    <h1 style="font-size:24px">Bestenliste</h1>
    <div class="sub">Dönerfriitig</div>
    <div class="board" id="boardList"><div class="muted">Lade…</div></div>
    <button class="btn" id="backBtn">Zurück</button>
  </div>
</div>

<script src="audio.js"></script>
<script>
// id = was gespeichert/an die Bestenliste geschickt wird; label = Anzeige
const MEMBERS = [
  { id: "CBO", label: "CBO" },
  { id: "SJU", label: "SJU" },
  { id: "PKN", label: "PKN" },
  { id: "YMI", label: "YMI" },
  { id: "MST/MSO", label: "MST/MSO" },
  { id: "JWU", label: "JWU 🥒" },
];
const labelOf = (id) => (MEMBERS.find(m => m.id === id) || {}).label || id;
const LS_KEY = "df_stapler_v1";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } },
  set(o) { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch {} },
};
let state = store.get();
let member = state.member || null;
let best = state.best || 0;

// Haptik (Vibration) – ignoriert, wenn das Gerät es nicht unterstützt
function vibrate(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch {} }

// ---- Sound ----
const muteBtn = document.getElementById("muteBtn");
let muted = localStorage.getItem("df_muted") === "1";
function paintMute() { muteBtn.textContent = muted ? "Off" : "On"; }
paintMute();
function startAudio() {
  DFAudio.unlock(); DFAudio.setMuted(muted);
  if (!muted) DFAudio.startMusic();
  window.removeEventListener("pointerdown", startAudio);
}
window.addEventListener("pointerdown", startAudio);
muteBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  muted = DFAudio.toggleMute();
  localStorage.setItem("df_muted", muted ? "1" : "0");
  paintMute(); if (!muted) DFAudio.startMusic();
});

// ---- Bestenliste-API (mit lokalem Fallback) ----
const api = {
  async top() {
    try { const r = await fetch("/api/scores", { cache: "no-store" }); if (!r.ok) throw 0; return await r.json(); }
    catch { return { scores: localTop(), offline: true }; }
  },
  async submit(name, score) {
    saveLocal(name, score);
    try {
      const r = await fetch("/api/scores", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, score }) });
      if (!r.ok) throw 0; return await r.json();
    } catch { return { scores: localTop(), offline: true }; }
  },
};
function localBoard() { const s = store.get(); return s.board || {}; }
function saveLocal(name, score) { const s = store.get(); const b = s.board || {}; if (!b[name] || score > b[name]) b[name] = score; s.board = b; store.set(s); }
function localTop() { const b = localBoard(); return Object.entries(b).map(([name, score]) => ({ name, score })).sort((a, c) => c.score - a.score).slice(0, 20); }

// ---- Canvas ----
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);

const LAYERS = [
  { name: "Brot", c: "#d9a857" }, { name: "Fleisch", c: "#8b4a2b" }, { name: "Zwiebeln", c: "#e7d9c3" },
  { name: "Tomate", c: "#c0392b" }, { name: "Salat", c: "#5fae4e" }, { name: "Gurke", c: "#7bb661" },
  { name: "Sauce", c: "#f0c14b" }, { name: "Käse", c: "#f4d35e" }, { name: "Pommes", c: "#e8b84b" },
  { name: "Peperoncini", c: "#3aa34a" },
];
const BASE_W = () => Math.min(W * 0.68, 300);
const LAYER_H = 34;
let game = null;

function newGame() {
  const baseW = BASE_W();
  const base = { x: (W - baseW) / 2, w: baseW, color: "#cfd6dd", name: "__plate" };
  game = { stack: [base], score: 0, combo: 0, camera: 0, camTarget: 0, moving: null, speed: 4.2, dir: 1, falling: [], over: false, flash: 0 };
  spawnMoving();
}
function topLayer() { return game.stack[game.stack.length - 1]; }
function spawnMoving() {
  const t = topLayer();
  const idx = game.stack.length - 1;
  const lay = LAYERS[idx % LAYERS.length];
  const fromLeft = (game.stack.length % 2 === 0);
  game.moving = { x: fromLeft ? -t.w : W, w: t.w, color: lay.c, name: lay.name, idx };
  game.dir = fromLeft ? 1 : -1;
  game.speed = 4.2 + Math.min(game.score * 0.22, 5.5);
}
function drop() {
  if (!game || game.over || !game.moving) return;
  const t = topLayer(); const m = game.moving;
  const left = Math.max(m.x, t.x); const right = Math.min(m.x + m.w, t.x + t.w);
  const overlap = right - left;
  if (overlap <= 0) {
    game.falling.push({ x: m.x, y: layerScreenY(game.stack.length), w: m.w, color: m.color, name: m.name, vy: 0, vx: game.dir * 2 });
    endGame(); return;
  }
  if (m.x < t.x) game.falling.push({ x: m.x, y: layerScreenY(game.stack.length), w: t.x - m.x, color: m.color, name: m.name, vy: 0, vx: -2 });
  else if (m.x + m.w > t.x + t.w) game.falling.push({ x: t.x + t.w, y: layerScreenY(game.stack.length), w: (m.x + m.w) - (t.x + t.w), color: m.color, name: m.name, vy: 0, vx: 2 });
  const perfect = Math.abs(m.x - t.x) < 6;
  let placedW = overlap, placedX = left;
  if (perfect) {
    game.combo++;
    const extra = 14;                                  // perfekt = Zutat wächst wieder leicht
    placedW = Math.min(overlap + extra, BASE_W());
    placedX = left - (placedW - overlap) / 2;
    game.score += 1 + game.combo;                       // Combo-Bonus
    showCombo(game.combo);
    DFAudio.perfect(); vibrate([0, 12, 22, 12]);
  } else {
    game.combo = 0;
    game.score += 1;
    DFAudio.hit(game.score); vibrate(8);
  }
  game.stack.push({ x: placedX, w: placedW, color: m.color, name: m.name });
  game.flash = 1; updateHud();
  if (game.score > 0) tapHint.classList.add("hidden");
  game.camTarget = Math.max(0, (game.stack.length - 1) * LAYER_H - (H * 0.45));
  game.moving = null; spawnMoving();
}
function layerScreenY(i) { const baseY = H - LAYER_H - 8; return baseY - i * LAYER_H + (game.camera || 0); }
let raf = null;
function loop() {
  raf = requestAnimationFrame(loop);
  if (!game) return;
  game.camera += ((game.camTarget || 0) - game.camera) * 0.15;
  if (game.moving && !game.over) {
    game.moving.x += game.dir * game.speed; const m = game.moving;
    if (game.dir > 0 && m.x > W) game.dir = -1;
    if (game.dir < 0 && m.x + m.w < 0) game.dir = 1;
  }
  for (const f of game.falling) { f.vy += 0.8; f.y += f.vy; f.x += f.vx; }
  game.falling = game.falling.filter(f => f.y < H + 100);
  if (game.flash > 0) game.flash -= 0.08;
  draw();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0d1626"); g.addColorStop(1, "#080c14");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < game.stack.length; i++) { const l = game.stack[i]; drawLayer(l.x, layerScreenY(i), l.w, l.color, l.name); }
  for (const f of game.falling) drawLayer(f.x, f.y, f.w, f.color, f.name, true);
  if (game.moving && !game.over) drawLayer(game.moving.x, layerScreenY(game.stack.length), game.moving.w, game.moving.color, game.moving.name);
  if (game.flash > 0) { ctx.fillStyle = `rgba(124,196,255,${game.flash * 0.10})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.42, W / 2, H * 0.5, Math.max(W, H) * 0.8);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(3,6,12,.5)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
function srnd(i) { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }
function tint(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}
// Jede Zutat sieht nach echtem Doener-Belag aus (Texturen statt Farbbalken)
function drawLayer(x, y, w, color, name, faded) {
  const h = LAYER_H - 4;
  ctx.save(); if (faded) ctx.globalAlpha = 0.85;
  if (name === "__plate") {
    ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h, w * 0.64, 7, 0, 0, 7); ctx.fill();
    const pg = ctx.createLinearGradient(0, y, 0, y + h);
    pg.addColorStop(0, "#f4f7fa"); pg.addColorStop(0.6, "#cfd6dd"); pg.addColorStop(1, "#a6afb8");
    ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2 + 3, w * 0.60, h * 0.42, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = "#8d97a1"; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = "rgba(120,132,144,.5)"; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2 + 3, w * 0.44, h * 0.26, 0, 0, 7); ctx.stroke();
    ctx.restore(); return;
  }
  const seed = Math.floor(x * 7 + w * 13);
  roundRect(x, y, w, h, 8);
  ctx.save(); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, tint(color, 26)); g.addColorStop(0.45, color); g.addColorStop(1, tint(color, -32));
  ctx.fillStyle = g; ctx.fillRect(x - 2, y, w + 4, h);
  if (name === "Brot") {
    ctx.fillStyle = "rgba(150,95,40,.30)"; ctx.fillRect(x, y, w, 5);
    ctx.fillStyle = "#fff6dd";
    for (let i = 0; i < w / 16; i++) {
      const sx = x + 8 + i * 16 + srnd(seed + i) * 6, sy = y + 8 + srnd(seed + i + 40) * (h - 14);
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(srnd(seed + i + 80) * 3);
      ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 1.4, 0, 0, 7); ctx.fill(); ctx.restore();
    }
  } else if (name === "Fleisch") {
    for (let r = 0; r < 3; r++) {
      const ly = y + 7 + r * (h / 3.2);
      ctx.strokeStyle = "rgba(62,30,10,.55)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, ly);
      for (let sx = 0; sx <= w; sx += 10) ctx.lineTo(x + sx, ly + Math.sin(sx * 0.3 + seed + r) * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(255,200,140,.35)"; ctx.lineWidth = 2;
    for (let i = 0; i < w / 34; i++) {
      const sx = x + 10 + i * 34 + srnd(seed + i) * 10;
      ctx.beginPath(); ctx.moveTo(sx, y + 6 + srnd(seed + i + 7) * 12); ctx.lineTo(sx + 7, y + 8 + srnd(seed + i + 7) * 12); ctx.stroke();
    }
  } else if (name === "Zwiebeln") {
    for (let i = 0; i < w / 24; i++) {
      const cx2 = x + 13 + i * 24, cy2 = y + h / 2 + (srnd(seed + i) - 0.5) * 6;
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(cx2, cy2, 8, 0, 7); ctx.stroke();
      ctx.strokeStyle = "rgba(190,160,125,.6)"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(cx2, cy2, 4, 0, 7); ctx.stroke();
    }
  } else if (name === "Tomate") {
    for (let i = 0; i < w / 30; i++) {
      const cx2 = x + 16 + i * 30, cy2 = y + h / 2;
      ctx.fillStyle = "#e8695e"; ctx.beginPath(); ctx.arc(cx2, cy2, 10, 0, 7); ctx.fill();
      ctx.strokeStyle = "#a92c22"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#f5c86e";
      for (let k = 0; k < 5; k++) { const a = k * 1.256 + seed; ctx.beginPath(); ctx.arc(cx2 + Math.cos(a) * 4.5, cy2 + Math.sin(a) * 4.5, 1.2, 0, 7); ctx.fill(); }
    }
  } else if (name === "Salat") {
    ctx.strokeStyle = "rgba(35,85,30,.5)"; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(x + srnd(seed + i) * w * 0.3, y + h);
      ctx.quadraticCurveTo(x + w * (0.3 + i * 0.25), y + 4, x + w * (0.4 + i * 0.28), y + h - 2);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,255,255,.18)";
    for (let i = 0; i < w / 22; i++) {
      ctx.beginPath(); ctx.arc(x + 10 + i * 22 + srnd(seed + i) * 8, y + 6 + srnd(seed + i + 9) * 5, 5, 0, Math.PI, true); ctx.fill();
    }
  } else if (name === "Gurke") {
    for (let i = 0; i < w / 28; i++) {
      const cx2 = x + 15 + i * 28, cy2 = y + h / 2;
      ctx.fillStyle = "#b8dba0"; ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, 7); ctx.fill();
      ctx.strokeStyle = "#3f7d33"; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.fillStyle = "#7bb661";
      for (let k = 0; k < 6; k++) { const a = k * 1.047 + seed; ctx.beginPath(); ctx.arc(cx2 + Math.cos(a) * 4, cy2 + Math.sin(a) * 4, 1.1, 0, 7); ctx.fill(); }
    }
  } else if (name === "Sauce") {
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.beginPath(); ctx.ellipse(x + w * 0.3, y + 7, w * 0.22, 3.5, -0.05, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(190,150,60,.25)";
    for (let i = 0; i < w / 26; i++) { ctx.beginPath(); ctx.arc(x + 12 + i * 26 + srnd(seed + i) * 8, y + h - 7 + srnd(seed + i + 3) * 3, 2, 0, 7); ctx.fill(); }
  } else if (name === "Käse") {
    ctx.fillStyle = "rgba(180,140,35,.5)";
    for (let i = 0; i < w / 20; i++) {
      const r = 2.5 + srnd(seed + i) * 3;
      ctx.beginPath(); ctx.arc(x + 10 + i * 20 + srnd(seed + i + 5) * 8, y + 7 + srnd(seed + i + 11) * (h - 14), r, 0, 7); ctx.fill();
    }
  } else if (name === "Pommes") {
    for (let i = 0; i < w / 15; i++) {
      const sx = x + 6 + i * 15 + srnd(seed + i) * 5;
      ctx.save(); ctx.translate(sx, y + h / 2); ctx.rotate((srnd(seed + i + 20) - 0.5) * 0.7);
      ctx.fillStyle = "#f5d07a"; ctx.fillRect(-2.4, -h / 2 + 4, 4.8, h - 8);
      ctx.strokeStyle = "rgba(160,105,30,.5)"; ctx.lineWidth = 1; ctx.strokeRect(-2.4, -h / 2 + 4, 4.8, h - 8);
      ctx.restore();
    }
  } else if (name === "Peperoncini") {
    for (let i = 0; i < w / 30; i++) {
      const sx = x + 14 + i * 30, sy = y + h / 2 + (srnd(seed + i) - 0.5) * 5;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate((srnd(seed + i + 6) - 0.5) * 1.2);
      ctx.fillStyle = "#1f7d33";
      ctx.beginPath(); ctx.moveTo(-8, -3);
      ctx.quadraticCurveTo(4, -8, 9, 1); ctx.quadraticCurveTo(2, 5, -8, 1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#145223"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-8, -2); ctx.lineTo(-12, -5); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
  // Kontur + weicher Glanz oben
  roundRect(x, y, w, h, 8);
  ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.10)"; roundRect(x, y, w, 6, 6); ctx.fill();
  // Sauce tropft unten raus
  if (name === "Sauce") {
    ctx.fillStyle = tint(color, 8);
    for (let i = 0; i < 3; i++) {
      const dx = x + w * (0.22 + i * 0.28) + srnd(seed + i) * 8;
      const dr = 3 + srnd(seed + i + 30) * 3;
      ctx.beginPath(); ctx.arc(dx, y + h, dr, 0, Math.PI); ctx.fill();
    }
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---- HUD / Screens ----
const hud = document.getElementById("hud");
const scoreEl = document.getElementById("score");
const whoEl = document.getElementById("who");
const bestEl = document.getElementById("best");
const tapHint = document.getElementById("tapHint");
const comboEl = document.getElementById("combo");
let comboTimer = null;
function showCombo(c) {
  if (c < 2) return;
  comboEl.textContent = "Combo ×" + c + "!  +" + c;
  comboEl.classList.remove("hidden");
  comboEl.style.animation = "none"; void comboEl.offsetWidth; comboEl.style.animation = "comboPop .5s ease";
  clearTimeout(comboTimer); comboTimer = setTimeout(() => comboEl.classList.add("hidden"), 750);
}
function updateHud() {
  scoreEl.textContent = game ? game.score : 0;
  whoEl.textContent = member ? "▸ " + labelOf(member) : "";
  bestEl.textContent = "Best: " + best;
}
const startScreen = document.getElementById("startScreen");
const overScreen = document.getElementById("overScreen");
const boardScreen = document.getElementById("boardScreen");
function show(el) {
  [startScreen, overScreen, boardScreen].forEach(s => s.classList.add("hidden"));
  if (el) el.classList.remove("hidden");
  const playing = !el;
  hud.classList.toggle("hidden", !playing);
  tapHint.classList.toggle("hidden", !playing);
}
const membersEl = document.getElementById("members");
const playBtn = document.getElementById("playBtn");
function renderMembers() {
  membersEl.innerHTML = "";
  MEMBERS.forEach(m => {
    const b = document.createElement("button");
    b.className = "member" + (m.id === member ? " active" : "");
    b.textContent = m.label;
    b.onclick = () => {
      member = m.id; state.member = m.id; store.set(state);
      best = (store.get().bests || {})[m.id] || 0;
      renderMembers(); playBtn.disabled = false;
    };
    membersEl.appendChild(b);
  });
  playBtn.disabled = !member;
}
function startPlay() { comboEl.classList.add("hidden"); show(null); resize(); newGame(); updateHud(); if (!raf) loop(); }
function endGame() {
  game.over = true; const sc = game.score;
  DFAudio.over();
  const s = store.get(); s.bests = s.bests || {};
  const wasBest = sc > (s.bests[member] || 0);
  vibrate(wasBest ? [0, 30, 40, 30, 40, 80] : [0, 50, 40, 50]);
  if (wasBest) { s.bests[member] = sc; store.set(s); best = sc; }
  state = store.get();
  document.getElementById("finalScore").textContent = sc + " Punkte";
  document.getElementById("overMsg").innerHTML = overMessage(sc);
  document.getElementById("newBest").classList.toggle("hidden", !wasBest);
  setTimeout(() => show(overScreen), 550);
  api.submit(member, sc);
}
function overMessage(sc) {
  if (sc === 0) return "Nicht mal das Brot getroffen? Das gibt eine <span class='bussen'>Busse von CHF 13</span>";
  if (sc < 5) return "Etwas mehr Übung, sonst kommst du als Letzter und gehst als Erster.";
  if (sc < 12) return "Solide gestapelt! Das gibt Respekt am Dönerfriitig.";
  if (sc < 20) return "Stark! Das reicht fast für die DF Chlöpfete.";
  return "Legendär! Du bist der Döner-King.";
}
const boardList = document.getElementById("boardList");
async function showBoard() {
  show(boardScreen);
  boardList.innerHTML = '<div class="muted">Lade…</div>';
  const data = await api.top();
  const scores = data.scores || [];
  if (!scores.length) { boardList.innerHTML = '<div class="muted">Noch kein Score. Spiel die erste Runde!</div>'; return; }
  let html = "";
  scores.slice(0, 12).forEach((row, i) => {
    const medal = (i + 1) + ".";
    const me = row.name === member ? " me" : ""; const gold = i < 3 ? " gold" : "";
    html += `<div class="row${me}${gold}"><span class="rank">${medal}</span><span class="name">${escapeHtml(labelOf(row.name))}</span><span class="pts">${row.score}</span></div>`;
  });
  if (data.offline) html += '<div class="muted">Offline, nur lokale Scores.</div>';
  boardList.innerHTML = html;
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---- Teilen ----
const toastEl = document.getElementById("toast");
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.add("hidden"), 1800);
}
async function shareScore() {
  const sc = game ? game.score : 0;
  const text = `Ich habe ${sc} Zutaten gestapelt beim Dönerfriitig Döner-Stapler! Schlägst du mich?`;
  const url = location.origin + location.pathname;
  try {
    if (navigator.share) { await navigator.share({ title: "Döner-Stapler", text, url }); return; }
  } catch { return; } // User hat abgebrochen
  try { await navigator.clipboard.writeText(text + " " + url); toast("Text kopiert!"); }
  catch { toast("Teilen geht auf diesem Gerät nicht 😅"); }
}

function onTap(e) { if (game && !game.over && !hud.classList.contains("hidden")) { e.preventDefault(); drop(); } }
canvas.addEventListener("pointerdown", onTap);
window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); drop(); } });

document.getElementById("playBtn").onclick = startPlay;
document.getElementById("againBtn").onclick = startPlay;
document.getElementById("changeBtn").onclick = () => { renderMembers(); show(startScreen); };
document.getElementById("boardBtn").onclick = showBoard;
document.getElementById("overBoardBtn").onclick = showBoard;
document.getElementById("shareBtn").onclick = shareScore;
document.getElementById("backBtn").onclick = () => show(game ? overScreen : startScreen);

resize();
if (member) best = (store.get().bests || {})[member] || 0;
renderMembers();
show(startScreen);
</script>
