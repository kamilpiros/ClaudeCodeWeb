<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c386d">
<title>Vereinsvermögen · Dönerfriitig</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { padding-bottom: 40px; }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(44,56,109,.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar img { width: 38px; height: 38px; object-fit: contain; }
  .topbar .t { font-size: 17px; font-weight: 800; line-height: 1.1; }
  .topbar .s { font-size: 11px; opacity: .6; letter-spacing: 1.5px; text-transform: uppercase; }
  .topbar a.home {
    margin-left: auto; color: var(--cream); opacity: .75; text-decoration: none;
    font-size: 13px; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 11px;
  }

  /* Fuenf Reiter passen auf schmalen Geraeten nicht nebeneinander, darum
     schmalere Polster und ein angeschnittener letzter Reiter als Wischhinweis. */
  .tabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 12px 14px 4px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto; padding: 9px 12px; border-radius: 11px; font-size: 13.5px; font-weight: 700;
    background: var(--card); color: var(--cream); border: 2px solid transparent; cursor: pointer;
    white-space: nowrap;
  }
  .tabs button.on { border-color: var(--blue2); background: #1d2750; color: var(--blue2); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 8px 14px 0; }
  .panel { display: none; } .panel.on { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 3px; font-size: 17px; font-weight: 800; color: var(--cream); }
  .card .sub2 { font-size: 12px; opacity: .6; margin-bottom: 14px; line-height: 1.4; }

  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .tw::-webkit-scrollbar { height: 5px; }
  .tw::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 5px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { font-size: 11px; opacity: .6; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
       border-bottom: 1px solid var(--line); }
  th.l, td.l { text-align: left; }
  .sn { display: block; font-size: 10.5px; opacity: .5; font-weight: 400; white-space: normal;
        max-width: 132px; line-height: 1.35; margin-top: 2px; }
  @media (min-width: 520px) { .sn { max-width: 260px; } }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,.06); }
  tbody tr:last-child { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }

  .hero2 { text-align: center; padding: 4px 0 2px; }
  .hero2 .big { font-size: 42px; font-weight: 800; color: var(--blue2); line-height: 1.05;
                font-variant-numeric: tabular-nums; }
  .hero2 .cur { font-size: 15px; opacity: .5; font-weight: 700; }
  .hero2 .sub { font-size: 12px; opacity: .6; margin-top: 5px; }

  .live {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
    border: 1px solid rgba(126,226,135,.45); color: #7ee287; margin-top: 8px;
  }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #7ee287;
            animation: pulse 1.8s ease-in-out infinite; }
  .live.off { border-color: rgba(238,244,251,.2); color: rgba(238,244,251,.5); }
  .live.off i { background: rgba(238,244,251,.4); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 9px; }
  .kpi { background: #1d2750; border: 1px solid var(--line); border-radius: 13px; padding: 12px; }
  .kpi .v { font-size: 20px; font-weight: 800; color: var(--blue2); font-variant-numeric: tabular-nums; }
  .kpi .k { font-size: 11px; opacity: .62; margin-top: 2px; line-height: 1.35; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip {
    padding: 7px 13px; border-radius: 10px; font-size: 13px; font-weight: 700;
    background: #1d2750; color: var(--cream); border: 2px solid transparent; cursor: pointer;
  }
  .chip.on { border-color: var(--blue2); color: var(--blue2); }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .lg { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; }
  .lg span.i { display: flex; align-items: center; gap: 6px; opacity: .85; }

  .rec { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
         border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .rec:last-child { border-bottom: none; }
  .rec .r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .note { font-size: 11.5px; opacity: .55; line-height: 1.5; margin-top: 10px; }
  .up { color: #4caf50; } .down { color: #ff6b8a; }

  .eras { display: grid; gap: 10px; }
  .era { display: flex; gap: 12px; align-items: flex-start; padding: 12px 13px;
         background: #1d2750; border: 1px solid var(--line); border-radius: 13px; }
  .era .bulb { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
  .era .y { font-size: 11px; opacity: .55; letter-spacing: .6px; text-transform: uppercase; }
  .era .n { font-size: 15px; font-weight: 800; }
  .era .d { font-size: 12px; opacity: .68; line-height: 1.45; margin-top: 3px; }

  .donutRow { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .donutRow svg { width: 176px; flex: 0 0 auto; }
  .donutRow .keys { flex: 1; min-width: 180px; }
  .keyrow { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 13.5px;
            border-bottom: 1px solid rgba(255,255,255,.06); }
  .keyrow:last-child { border-bottom: none; }
  .keyrow .kv { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .keyrow .kp { opacity: .5; font-size: 12px; min-width: 46px; text-align: right; }

  /* Zeitstrahl der Anlagereise */
  .steps { position: relative; padding-left: 22px; }
  .steps::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px;
                   width: 2px; background: rgba(255,255,255,.12); }
  .step { position: relative; padding: 9px 0; }
  .step::before { content: ""; position: absolute; left: -21px; top: 15px; width: 12px; height: 12px;
                  border-radius: 50%; background: var(--card); border: 2.5px solid var(--blue2); }
  .step.gold::before { border-color: #ffd166; }
  .step.crypto::before { border-color: #2ee6a8; }
  .step.now::before { border-color: #7ee287; background: #7ee287; }
  .step .sd { font-size: 11px; opacity: .5; letter-spacing: .5px; text-transform: uppercase; }
  .step .st { font-size: 14.5px; font-weight: 700; margin-top: 1px; }
  .step .sv { font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }

  @media (max-width: 439px) {
    table { font-size: 12.5px; }
    th, td { padding: 8px 4px; }
    .hero2 .big { font-size: 36px; }
    .donutRow { justify-content: center; }
  }
</style>
</head>
<body>
<div class="topbar">
  <img src="logo.png" alt="DF" onerror="this.style.display='none'">
  <div><div class="t">Vereinsvermögen</div><div class="s">Bilanz und Anlagen</div></div>
  <a class="home" href="index.html">Start</a>
</div>

<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="panel on" id="p-overview"></div>
  <div class="panel" id="p-alloc"></div>
  <div class="panel" id="p-gold"></div>
  <div class="panel" id="p-return"></div>
  <div class="panel" id="p-spend"></div>
  <div class="panel" id="p-audit"></div>
</div>

<script src="df-data.js"></script>
<!-- Der Parameter erzwingt beim Leser den frischen Datensatz, sonst zeigt der
     Browser wochenlang die alte Datei. Bei jeder Änderung an df-assets.js mit
     nachführen. -->
<script src="df-assets.js?v=20260727"></script>
<script>
const A = window.DF_ASSETS;
const D = window.DF_DATA;
const G = A.gold;
const OZ = 31.1034768;

const C = { deb: "#7cc4ff", gold: "#ffd166", crypto: "#2ee6a8", cash: "#8fa3c4", prov: "#b39dff" };
const kindCol = (k) => k === "Gold" ? C.gold : k === "Krypto" ? C.crypto : C.cash;

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chf = (v) => v.toLocaleString("de-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const chf0 = (v) => Math.round(v).toLocaleString("de-CH");
const pct1 = (v) => (v * 100).toFixed(1).replace(".", ",") + " %";
const sig = (v, f) => (v >= 0 ? "+" : "−") + f(Math.abs(v));
const sigPct = (v) => sig(v, x => (x * 100).toFixed(1).replace(".", ",") + " %");
const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const mLabel = (m) => MON[+m.slice(5) - 1] + " " + m.slice(0, 4);
const dmy = (iso) => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };

const Y = A.years;
const cur = Y[Y.length - 1];
// Das Blatt 2026 rechnet die Reserve als Goldwert vom 05.12.2025 minus die Ausgaben
// des laufenden Jahres. Diese Differenz brauchen wir für den Marktwert.
const spent = Math.round((G.valuationChf - cur.reserves) * 100) / 100;

// ---------- Kurs: live wenn möglich, sonst der letzte Monatsdurchschnitt ----------
let LIVE = null;
function px() {
  if (LIVE) return { chfG: LIVE.chfPerGram, chfOz: LIVE.chfPerOz, live: true,
                     label: "Live-Kurs", ts: LIVE.ts, stale: !!LIVE.stale, source: LIVE.source };
  return { chfG: G.last.chfG, chfOz: G.last.chfOz, live: false,
           label: "Monatsdurchschnitt " + mLabel(G.last.m) };
}
const goldValue = () => G.xau * px().chfOz;
const marketValue = () => cur.debitors + goldValue() - spent;

function liveBadge() {
  const p = px();
  if (!p.live) return `<div class="live off"><i></i>${esc(p.label)}</div>`;
  const age = Math.round((Date.now() - p.ts) / 60000);
  return `<div class="live"><i></i>Live${p.stale ? ", letzter bekannter Kurs" : ""}${age > 1 ? ` · vor ${age} Min` : ""}</div>`;
}

// Interner Zinsfuss über die beiden Kryptoeinzahlungen und den heutigen Goldwert
function irr(endValue) {
  const flows = [[new Date(A.crypto.in1Date), -A.crypto.in1],
                 [new Date(A.crypto.in2Date), -A.crypto.in2]];
  const t0 = flows[0][0], end = new Date();
  const yrs = (d) => (d - t0) / (365.25 * 86400000);
  const npv = (r) => flows.reduce((s, [d, cf]) => s + cf / Math.pow(1 + r, yrs(d)), 0)
                     + endValue / Math.pow(1 + r, yrs(end));
  let lo = -0.95, hi = 5;
  for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(m) > 0) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
const yearsHeld = () => (new Date() - new Date(A.crypto.in1Date)) / (365.25 * 86400000);

// ===================== Tabs =====================
const TABS = [["overview", "Übersicht"], ["alloc", "Allokation"], ["gold", "Gold"],
              ["return", "Rendite"], ["spend", "Ausgaben"], ["audit", "Prüfung"]];
document.getElementById("tabs").innerHTML =
  TABS.map(([id, l], i) => `<button data-t="${id}" class="${i ? "" : "on"}">${l}</button>`).join("");
document.getElementById("tabs").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.t));
  window.scrollTo({ top: 0, behavior: "smooth" });
};

// ===================== Diagramme, von Hand als SVG =====================
function columnStack(rows, keys, colors, opts) {
  const o = Object.assign({ w: 680, h: 250, fmt: v => v, share: false }, opts || {});
  const { w, h } = o;
  const left = 44, right = w - 6, top = 22, bottom = h - 24;
  const tot = rows.map(r => keys.reduce((s, k) => s + (r.parts[k] || 0), 0));
  const max = o.share ? 1 : Math.max(...tot, 1) * 1.12;
  const step = (right - left) / rows.length;
  const bw = Math.min(38, step * 0.62);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = bottom - (bottom - top) * (i / 4);
    g += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    g += `<text x="${left - 6}" y="${y + 4}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="end">${o.share ? Math.round(v * 100) + "%" : chf0(v)}</text>`;
  }
  rows.forEach((r, i) => {
    const cx = left + step * (i + 0.5);
    const base = o.share ? (tot[i] || 1) : 1;
    const cols = r.colors || colors;
    let y = bottom;
    keys.forEach((k, ki) => {
      const v = (r.parts[k] || 0) / base; if (!v) return;
      const bh = (bottom - top) * (v / max);
      y -= bh;
      g += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(1, bh)}"
             fill="${cols[ki]}" ${ki === keys.length - 1 ? 'rx="3"' : ""}/>`;
    });
    if (!o.share) {
      g += `<text x="${cx}" y="${y - 6}" fill="rgba(238,244,251,.8)" font-size="10.5"
             text-anchor="middle" font-weight="700">${o.fmt(tot[i])}</text>`;
    }
    g += `<text x="${cx}" y="${bottom + 15}" fill="rgba(238,244,251,.55)" font-size="10.5"
           text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

let gradSeq = 0;
function areaChart(pts, opts) {
  const o = Object.assign({ w: 680, h: 250, color: C.gold, yFmt: v => chf0(v),
                            marks: [], yMin: null, fill: true }, opts || {});
  const { w, h } = o;
  const left = 46, right = w - 8, top = 14, bottom = h - 26;
  const id = "ac" + (++gradSeq);
  const vals = pts.map(p => p.y);
  let max = Math.max(...vals), min = o.yMin !== null ? o.yMin : Math.min(...vals);
  const padY = (max - min) * 0.12 || 1;
  max += padY; if (o.yMin === null) min = Math.max(0, min - padY);
  const X = (i) => left + (right - left) * (pts.length > 1 ? i / (pts.length - 1) : 0.5);
  const Yv = (v) => bottom - (bottom - top) * ((v - min) / (max - min || 1));
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4, y = Yv(v);
    g += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    g += `<text x="${left - 6}" y="${y + 4}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="end">${o.yFmt(v)}</text>`;
  }
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Yv(p.y).toFixed(1)}`).join(" ");
  if (o.fill) {
    g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${o.color}" stop-opacity=".38"/>
      <stop offset="100%" stop-color="${o.color}" stop-opacity="0"/></linearGradient></defs>`;
    g += `<polygon points="${X(0)},${bottom} ${line} ${X(pts.length - 1)},${bottom}" fill="url(#${id})"/>`;
  }
  g += `<polyline points="${line}" fill="none" stroke="${o.color}" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  o.marks.forEach(mk => {
    const i = pts.findIndex(p => p.x === mk.at); if (i < 0) return;
    const x = X(i), y = Yv(pts[i].y);
    g += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="${mk.color || "#eef4fb"}"
           stroke-width="1.2" stroke-dasharray="3 4" opacity=".55"/>`;
    g += `<circle cx="${x}" cy="${y}" r="4.2" fill="${mk.color || "#eef4fb"}" stroke="#26315e" stroke-width="2"/>`;
    const anchor = i > pts.length * 0.62 ? "end" : "start";
    g += `<text x="${x + (anchor === "end" ? -6 : 6)}" y="${top + (mk.row || 0) * 13 + 9}"
           fill="${mk.color || "#eef4fb"}" font-size="10.5" font-weight="700"
           text-anchor="${anchor}">${esc(mk.label)}</text>`;
  });
  const short = pts.length <= 30;
  const every = Math.max(1, Math.round(pts.length / (short ? 5 : 6)));
  let lastLbl = null;
  pts.forEach((p, i) => {
    if (i % every && i !== pts.length - 1) return;
    const lbl = short ? mLabel(p.x).replace(" 20", " ") : p.x.slice(0, 4);
    if (lbl === lastLbl) return;
    lastLbl = lbl;
    g += `<text x="${X(i)}" y="${bottom + 16}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="middle">${esc(lbl)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

// Verlauf auf einer echten Zeitachse. Die Mappenstände liegen unregelmässig,
// deshalb wird nach Datum positioniert und nicht nach Position in der Liste.
function timeChart(pts, opts) {
  const o = Object.assign({ w: 680, h: 260, bands: [], dots: [], yFmt: v => chf0(v) }, opts || {});
  const { w, h } = o;
  const left = 48, right = w - 8, top = 16, bottom = h - 30;
  const T = (d) => new Date(d).getTime();
  const t0 = T(pts[0].d), t1 = T(pts[pts.length - 1].d);
  const X = (d) => left + (right - left) * ((T(d) - t0) / (t1 - t0 || 1));
  const max = Math.max(...pts.map(p => p.v)) * 1.1;
  const Yv = (v) => bottom - (bottom - top) * (v / max);
  let g = "";
  o.bands.forEach(b => {
    g += `<rect x="${X(b.from).toFixed(1)}" y="${top}"
           width="${Math.max(0, X(b.to) - X(b.from)).toFixed(1)}" height="${bottom - top}"
           fill="${b.color}" opacity=".07"/>`;
  });
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = Yv(v);
    g += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    g += `<text x="${left - 6}" y="${y + 4}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="end">${o.yFmt(v)}</text>`;
  }
  const line = pts.map(p => `${X(p.d).toFixed(1)},${Yv(p.v).toFixed(1)}`).join(" ");
  g += `<polyline points="${line}" fill="none" stroke="${C.deb}" stroke-width="2.2"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach(p => {
    const big = p.close;
    g += `<circle cx="${X(p.d).toFixed(1)}" cy="${Yv(p.v).toFixed(1)}" r="${big ? 4.4 : 2}"
           fill="${big ? C.gold : C.deb}" ${big ? 'stroke="#26315e" stroke-width="1.6"' : ""}>
           <title>${esc(dmy(p.d))}: CHF ${chf0(p.v)}</title></circle>`;
  });
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear();
  for (let y = y0; y <= y1; y++) {
    const d = `${y}-01-01`; if (T(d) < t0 || T(d) > t1) continue;
    g += `<line x1="${X(d).toFixed(1)}" y1="${top}" x2="${X(d).toFixed(1)}" y2="${bottom}"
           stroke="rgba(255,255,255,.07)"/>`;
    g += `<text x="${X(d).toFixed(1)}" y="${bottom + 16}" fill="rgba(238,244,251,.5)"
           font-size="10.5" text-anchor="middle">${y}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

function donut(parts) {
  const R = 62, r = 38, cx = 76, cy = 76;
  const tot = parts.reduce((s, p) => s + p.value, 0) || 1;
  let a0 = -Math.PI / 2, g = "";
  parts.forEach(p => {
    const a1 = a0 + 2 * Math.PI * (p.value / tot);
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)},${(cy + rad * Math.sin(a)).toFixed(2)}`;
    g += `<path d="M ${P(R, a0)} A ${R} ${R} 0 ${big} 1 ${P(R, a1)} L ${P(r, a1)}
           A ${r} ${r} 0 ${big} 0 ${P(r, a0)} Z" fill="${p.color}"/>`;
    a0 = a1;
  });
  g += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="#eef4fb" font-size="17"
         font-weight="800">${chf0(tot)}</text>`;
  g += `<text x="${cx}" y="${cy + 14}" text-anchor="middle" fill="rgba(238,244,251,.5)"
         font-size="10.5">CHF total</text>`;
  return `<svg viewBox="0 0 152 152" role="img">${g}</svg>`;
}

// Monatsreihe plus, falls vorhanden, der Live-Kurs als zusätzlicher Punkt
function goldPoints() {
  const s = G.series.map(p => ({ x: p.m, y: p.chfG, oz: p.chfOz }));
  const p = px();
  if (p.live) {
    const now = new Date();
    const m = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    if (m > G.last.m) s.push({ x: m, y: p.chfG, oz: p.chfOz });
    else s[s.length - 1] = { x: m, y: p.chfG, oz: p.chfOz };
  }
  return s;
}

    { c: "now", d: "jetzt", t: "Aktueller Wert",

  ].map(s => `<div class="step ${s.c}"><div class="sd">${esc(s.d)}</div>
    <div class="st">${esc(s.t)}</div><div class="sv">${esc(s.v)}</div></div>`).join("");

  document.getElementById("p-return").innerHTML = `
    <div class="card">
      <div class="hero2">
        <div class="cur">Aus CHF ${chf0(K.totalIn)} wurden</div>
        <div class="big" style="color:#7ee287">${chf(goldNow)}</div>
        <div class="sub">seit ${dmy(K.in1Date)}, das ist das ${mult.toFixed(2).replace(".", ",")}-fache</div>
        ${liveBadge()}
      </div>
    </div>
    <div class="card">
      <div class="kpis">
        <div class="kpi"><div class="v" style="color:#7ee287">${mult.toFixed(2).replace(".", ",")}×</div><div class="k">Multiple auf den Einsatz</div></div>
        <div class="kpi"><div class="v" style="color:#7ee287">${sigPct(mult - 1)}</div><div class="k">Gesamtrendite</div></div>
        <div class="kpi"><div class="v" style="color:#7ee287">${sigPct(r)}</div><div class="k">pro Jahr, interner Zinsfuss</div></div>
        <div class="kpi"><div class="v">${held.toFixed(1).replace(".", ",")}</div><div class="k">Jahre angelegt</div></div>
      </div>
      <div class="note">Der Verein hat nie etwas zu Geld gemacht. Das Kryptodepot wurde nicht
      verkauft und ausgegeben, sondern in Gold umgeschichtet, und das Gold liegt bis heute
      unangetastet im Depot. Die Zahl oben ist deshalb ein Buchgewinn, kein realisierter.
      Der interne Zinsfuss rechnet ein, dass die beiden Einzahlungen zu verschiedenen
      Zeitpunkten kamen. Ohne diese Gewichtung wäre die Zahl zu schmeichelhaft.
      Nicht enthalten sind Handelsspesen und der Unterschied zwischen Kauf- und Verkaufskurs.
      Die Anlässe des Vereins werden aus den jeweils frisch einkassierten Bussen bezahlt,
      nicht aus der Reserve. Nachgeprüft: der Abschluss ${Y[7].year} weist CHF ${chf0(A.crypto.out)}
      Krypto aus, und derselbe Betrag kauft im Januar ${G.buyMonth.slice(0, 4)} genau
      ${G.ozFromCrypto.toFixed(2).replace(".", ",")} Unzen Gold. Im Depot liegen ${G.xau} XAU.
      Für einen Anlass abgezweigt wurde also nichts. Die einzige Ausnahme sind
      CHF ${chf0(spent)} beim Übergang ins Fiskaljahr ${cur.year}, siehe Tab Prüfung.</div>
    </div>
    <div class="card">
      <h2>Die Reise des Vereinsvermögens</h2>
      <div class="sub2">Von sechs zufällig gewählten Coins zur Goldreserve.</div>
      <div class="steps">${steps}</div>
    </div>
    <div class="card">
      <h2>Das Kryptodepot im Detail</h2>
      <div class="sub2">Wert je Position an den beiden im Vereinsdokument erfassten Stichtagen.</div>
      <div class="tw"><table>
        <thead><tr><th class="l">Member</th><th class="l">Position</th><th>Einsatz</th>
          ${stageCols.map(s => `<th>${s.d.slice(8)}.${s.d.slice(5, 7)}.</th>`).join("")}<th>±</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr style="border-top:1px solid var(--line)">
          <td class="l" style="font-weight:800">Total</td><td></td>
          <td class="num" style="font-weight:800">${chf0(sumStart)}</td>
          ${stageCols.map((s, i) => `<td class="num" style="font-weight:800">${i === stageCols.length - 1 ? chf0(sum2802) : ""}</td>`).join("")}
          <td class="num ${sum2802 >= sumStart ? "up" : "down"}" style="font-weight:800">${sig(sum2802 / sumStart - 1, v => Math.round(v * 100) + "%")}</td>
        </tr></tfoot></table></div>
      <div class="note">Am ${dmy(K.stages[0].d)} stand das Depot der sechs Coins bei
      CHF ${chf0(K.coins.reduce((s, c) => s + c.v0501, 0))} gegenüber CHF ${chf0(K.in1)} Einsatz,
      also ${sigPct(K.coins.reduce((s, c) => s + c.v0501, 0) / K.in1 - 1)}. Zwei Monate später
      war der Rückstand aufgeholt. Bis zum Abschluss des Fiskaljahrs ${Y[7].year} wuchs die
      Reserve auf CHF ${chf0(K.out)}, das ${(K.out / K.totalIn).toFixed(2).replace(".", ",")}-fache
      des Einsatzes. Nach dem ${dmy(K.stages[1].d)} führte niemand mehr Einzelkurse nach,
      ab dann steht nur noch eine Summe in der Mappe.
      Beim Kauf gingen je nach Coin zwischen ${pct1(Math.min(...K.coins.map(c => c.fee)))} und
      ${pct1(Math.max(...K.coins.map(c => c.fee)))} an Gebühren weg, im Schnitt
      ${pct1(K.coins.reduce((s, c) => s + c.fee, 0) / K.coins.length)}.</div>
    </div>
    <div class="card">
      <h2>Jede erfasste Bewertung</h2>
      <div class="sub2">Alle ${K.marks.length} Stände, die sich in den ${A.sources.books} Mappen
      belegen lassen. Die grösste Lücke liegt zwischen Februar und Dezember ${K.marks[8].d.slice(0, 4)}.</div>
      <div class="tw"><table>
        <thead><tr><th class="l">Datum</th><th>Wert</th><th class="l">Art</th></tr></thead>
        <tbody>${K.marks.map(m => {
          const col = m.kind === "markt" ? "#7ee287" : m.kind === "einstand" ? C.deb : "#ff9f43";
          const lbl = m.kind === "markt" ? "Kurs je Coin" : m.kind === "einstand" ? "Einzahlung" : "Schätzung";
          return `<tr>
            <td class="l" style="font-weight:700">${dmy(m.d)}
              <span class="sn">${esc(m.note)}</span></td>
            <td class="num" style="font-weight:700">${chf0(m.chf)}</td>
            <td class="l"><span class="dot" style="background:${col}"></span>
              <span style="opacity:.85;font-size:12.5px">&nbsp;${lbl}</span></td>
          </tr>`;
        }).join("")}</tbody></table></div>
      <div class="note">Die beiden letzten Werte sind ausdrücklich Schätzungen. Der Revisionsbericht
      zum Fiskaljahr ${Y[7].year} nennt die Position wörtlich «Kryptoreserve Schätzig MSO/MST».
      Das erklärt, warum die Zahl nicht auf den Rappen zum Goldwert des Folgemonats passt.</div>
      <div class="note" style="border-left-color:#ff9f43">Eine weitere Falle: die Mappe vom
      02.10.2023 zeigt in der Spalte mit der Kopfzeile «Rate 12.05.2023» andere Zahlen als die
      Mappe vom Juni. Die Werte wurden nachgeführt, die Kopfzeile nicht. Der Stand von
      CHF ${chf0(K.marks[4].chf)} gehört zum Ende September ${K.marks[4].d.slice(0, 4)}, nicht zum Mai.</div>
    </div>
    <div class="card">
      <h2>Beitrag zum Vereinsvermögen</h2>
      <div class="sub2">Was die Anlagen gegenüber dem blossen Horten von Bargeld gebracht haben.</div>
      <div class="rec"><span>Eingesetzte Bussengelder</span>
        <span class="r">${chf0(K.totalIn)}</span></div>
      <div class="rec"><span>Wert heute</span>
        <span class="r" style="font-weight:800;color:#7ee287">${chf0(goldNow)}</span></div>
      <div class="rec"><span>Gewinn aus der Anlage</span>
        <span class="r" style="font-weight:800;color:#7ee287">${sig(goldNow - K.totalIn, chf0)}</span></div>
      <div class="rec"><span>Anteil am heutigen Vermögen</span>
        <span class="r">${pct1((goldNow - K.totalIn) / marketValue())}</span></div>
      <div class="note">Anders gesagt: ${pct1((goldNow - K.totalIn) / marketValue())} des heutigen
      Vereinsvermögens stammen nicht aus Bussen, sondern daraus, dass das Geld angelegt wurde.
      Das entspricht ungefähr ${Math.round((goldNow - K.totalIn) / 13)} Absenzbussen zu CHF 13.</div>
    </div>`;
}

// ===================== Ausgaben =====================
function renderSpend() {
  const S = A.spending;
  const avg = A.spentTotal / S.length;
  const collected = S.reduce((s, x) => s + x.collected, 0);
  const toRes = S.reduce((s, x) => s + x.toReserve, 0);

  const rows = S.map(x => ({
    label: String(x.year).slice(2),
    parts: { spent: Math.max(0, x.spent), res: Math.max(0, x.toReserve) },
    colors: ["#ff9f43", C.gold],
  }));

  const table = S.map(x => `<tr>
    <td class="l" style="font-weight:700">${x.year}</td>
    <td class="num">${chf0(x.collected)}</td>
    <td class="num" style="font-weight:800;color:#ff9f43">${chf0(x.spent)}</td>
    <td class="num ${x.toReserve >= 0 ? "up" : "down"}">${sig(x.toReserve, chf0)}</td>
    <td class="num" style="opacity:.7">${pct1(x.spent / x.collected)}</td>
  </tr>`).join("");

  document.getElementById("p-spend").innerHTML = `
    <div class="card">
      <div class="hero2">
        <div class="cur">Seit dem Fiskaljahr ${S[0].year} in Anlässe geflossen</div>
        <div class="big" style="color:#ff9f43">${chf(A.spentTotal)}</div>
        <div class="sub">CHF, im Schnitt ${chf0(avg)} pro Vereinsjahr</div>
      </div>
    </div>
    <div class="card">
      <h2>Wie der Kreislauf läuft</h2>
      <div class="sub2">Jedes Vereinsjahr endet an der Chlöpfete, und dort passiert alles auf einmal.</div>
      <div class="steps">
        <div class="step"><div class="sd">während des Jahres</div>
          <div class="st">Bussen fallen an</div>
          <div class="sv">Absenz, Last In, LIFO und der Mitgliederbeitrag, im Schnitt CHF ${chf0(collected / S.length)} pro Jahr</div></div>
        <div class="step"><div class="sd">an der Chlöpfete</div>
          <div class="st">Die Debitoren werden einkassiert</div>
          <div class="sv">der Revisor stellt fest, wer was schuldet, danach wird gezahlt</div></div>
        <div class="step" style="--x:1"><div class="sd">ein bis zwei Mal pro Jahr</div>
          <div class="st">Die Anlässe werden bezahlt</div>
          <div class="sv">Quo Vadis, Brüglete und die Chlöpfete selbst, zusammen CHF ${chf0(avg)} pro Jahr</div></div>
        <div class="step gold"><div class="sd">was übrig bleibt</div>
          <div class="st">Wandert in die Reserve</div>
          <div class="sv">CHF ${chf0(toRes)} über alle Jahre, heute als Gold gehalten</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Einnahmen gegen Ausgaben</h2>
      <div class="sub2">Was in einem Vereinsjahr an Bussen zusammenkam und was davon in Anlässe floss.</div>
      ${columnStack(rows, ["spent", "res"], ["#ff9f43", C.gold], { fmt: v => chf0(v) })}
      <div class="lg">
        <span class="i"><span class="dot" style="background:#ff9f43"></span>für Anlässe ausgegeben</span>
        <span class="i"><span class="dot" style="background:${C.gold}"></span>in die Reserve gelegt</span>
      </div>
      <div class="note">In Jahren ohne gelben Balken wurde mehr ausgegeben als eingenommen,
      die Differenz kam aus der Reserve.</div>
    </div>
    <div class="card">
      <h2>Zahlen je Vereinsjahr</h2>
      <div class="tw"><table>
        <thead><tr><th class="l">FJ</th><th>Einkassiert</th><th>Anlässe</th><th>In Reserve</th><th>Quote</th></tr></thead>
        <tbody>${table}</tbody>
        <tfoot><tr style="border-top:1px solid var(--line)">
          <td class="l" style="font-weight:800">Total</td>
          <td class="num" style="font-weight:800">${chf0(collected)}</td>
          <td class="num" style="font-weight:800;color:#ff9f43">${chf0(A.spentTotal)}</td>
          <td class="num" style="font-weight:800">${sig(toRes, chf0)}</td>
          <td class="num" style="font-weight:800">${pct1(A.spentTotal / collected)}</td>
        </tr></tfoot></table></div>
      <div class="note">Rund ${pct1(A.spentTotal / collected)} aller je eingezogenen Bussen wurden
      wieder unter den Mitgliedern verzehrt. Der Rest liegt heute in der Goldreserve.</div>
    </div>
    <div class="card">
      <h2>Woher diese Zahlen stammen</h2>
      <div class="sub2">Die Ausgaben sind nirgends als Liste erfasst, sie lassen sich aber rechnen.</div>
      <div class="note" style="opacity:.75;font-size:12px">
        Die Rechnung lautet: einkassierte Debitoren minus das, was neu in die Reserve floss.
        Für Krypto und Gold zählt dabei der Kaufpreis, nicht der spätere Marktwert, sonst würde
        die Rendite fälschlich als Ausgabe erscheinen.
        Für die Fiskaljahre 2017 und 2018 lässt sich nichts ableiten, weil die Kasse erst
        ab 2019 separat geführt wurde und der erste Übertrag drei Jahre zusammenfasst.
      </div>
      <div class="tw" style="margin-top:12px"><table>
        <thead><tr><th class="l">Belegte Ausgabe</th><th>Betrag</th></tr></thead>
        <tbody>${A.events.map(e => `<tr>
          <td class="l" style="font-weight:700">${esc(e.what)}
            <span class="sn">${esc(e.proof)}</span></td>
          <td class="num" style="font-weight:800;color:#ff9f43">${chf0(e.chf)}</td>
        </tr>`).join("")}</tbody></table></div>
      <div class="note">Mehr steht nicht drin. Eine Liste der Anlässe mit Einzelbeträgen führt
      keine der ${A.sources.books} Mappen. Nur diese zwei Posten sind ausdrücklich verbucht,
      alles andere ist gerechnet. Für ${A.events[0].fy} trifft die Rechnung den verbuchten
      Betrag auf den Rappen, das ist der beste verfügbare Test der Methode.</div>
    </div>
    <div class="card">
      <h2>Woraus die Reserve besteht</h2>
      <div class="sub2">Ein Wochenbericht von ${dmy("2021-10-29")} schlüsselt die Kasse
      des Fiskaljahrs 2020 auf. Es ist die einzige solche Aufstellung.</div>
      <div class="rec"><span>Restgeld der letzten Brüglete, bereits einbezahlt</span>
        <span class="r">${chf0(A.reserveSplit2020.rest)}</span></div>
      <div class="rec"><span>Jahresbeitrag für Investitionen, einbezahlt und nicht angelegt</span>
        <span class="r">${chf0(A.reserveSplit2020.beitrag)}</span></div>
      <div class="rec"><span>Bussen 2020</span>
        <span class="r">${chf0(A.reserveSplit2020.bussen)}</span></div>
      <div class="rec" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px">
        <span style="font-weight:700">Total 2020</span>
        <span class="r" style="font-weight:800">${chf0(A.reserveSplit2020.total)}</span></div>
      <div class="note">Wichtig daran: die Reserve ist nicht nur Restgeld. Es fliesst auch ein
      ausdrücklicher Jahresbeitrag für Investitionen hinein, im Fiskaljahr 2020 CHF 50 je Mitglied.
      Die Reserve wächst also nicht allein aus dem, was an der Chlöpfete übrig bleibt.</div>
    </div>`;
}

// ===================== Prüfung =====================
function renderAudit() {
  const checked = Y.filter(y => y.year <= 2025);
  const rows = checked.map(y => `<tr>
    <td class="l" style="font-weight:700">${y.year}</td>
    <td class="num">${chf0(y.debitors)}</td>
    <td class="num">${y.reserves ? chf0(y.reserves) : "<span style='opacity:.35'>–</span>"}</td>
    <td class="num" style="font-weight:800">${chf0(y.total)}</td>
    <td class="l"><span class="dot" style="background:#7ee287"></span>
      <span style="opacity:.85;font-size:12.5px">&nbsp;deckt sich</span></td>
  </tr>`).join("");

  const open = [
    { t: "Die CHF " + chf0(spent) + " beim Jahreswechsel", s: "offen",
      d: `Der Abschluss ${Y[8].year} führt die Reserve mit CHF ${chf(G.valuationChf)},
          das Blatt ${cur.year} übernimmt sie mit CHF ${chf0(cur.reserves)}, beide zum selben
          Stichtag ${dmy(G.valuationDate)}. Die Differenz von CHF ${chf0(spent)} entspricht
          etwa ${(spent / G.series.find(s => s.m === G.valuationDate.slice(0, 7)).chfOz).toFixed(3).replace(".", ",")}
          Unzen. Keine Mappe und kein Revisionsbericht nennt einen Grund. Möglich sind eine
          Korrektur der Bewertung oder ein tatsächlicher Bezug. Ohne Kontoauszug von Revolut
          lässt sich das nicht entscheiden.` },
    { t: "Die Mappen vor Oktober 2021", s: "fehlt",
      d: `Die älteste erhaltene Arbeitsmappe stammt vom ${dmy(A.sources.from)}. Für die
          Fiskaljahre ${Y[0].year} bis ${Y[3].year} gibt es deshalb keine unterjährigen Stände,
          nur die Abschlüsse. Diese stehen allerdings in jeder späteren Mappe als eigenes
          Blatt und stimmen dort überall überein.` },
    { t: "Ausgaben je einzelnem Anlass", s: "fehlt",
      d: `Nur zwei Posten sind ausdrücklich verbucht, siehe Tab Ausgaben. Eine Aufstellung
          pro Anlass führt keine der ${A.sources.books} Mappen. Die Jahreswerte bleiben
          deshalb gerechnet, nicht belegt.` },
    { t: "Gewicht und Kaufdatum des Goldes", s: "geklärt",
      d: `Nirgends erfasst, aber aus drei unabhängigen Stellen zurückgerechnet und stimmig:
          ${G.marks[1].impliedOz.toFixed(2).replace(".", ",")} Unzen am ${dmy(G.marks[1].d)},
          ${G.marks[2].impliedOz.toFixed(2).replace(".", ",")} Unzen am ${dmy(G.marks[2].d)},
          ${G.ozFromCrypto.toFixed(2).replace(".", ",")} Unzen aus dem Kryptoerlös.
          Das Depot zeigt ${G.xau} XAU.` },
    { t: "Wurde Krypto für einen Anlass gebraucht", s: "geklärt",
      d: `Nein. Der volle Abschlussbetrag von CHF ${chf0(A.crypto.out)} ist im Gold
          wiederzufinden. Wären davon CHF 850 abgeflossen, wie es der erste Eintrag im
          Blatt ${Y[8].year} nahelegt, läge der Bestand bei rund 1,2 Unzen. Im Oktober und
          im Dezember ${G.valuationDate.slice(0, 4)} weisen die Mappen aber übereinstimmend
          knapp 1,6 Unzen aus. Die CHF ${chf0(G.marks[0].chf)} sind eine zu tiefe Schätzung,
          kein Abfluss.` },
  ];

  document.getElementById("p-audit").innerHTML = `
    <div class="card">
      <div class="hero2">
        <div class="cur">Geprüfte Arbeitsmappen</div>
        <div class="big" style="color:#7ee287">${A.sources.books}</div>
        <div class="sub">${dmy(A.sources.from)} bis ${dmy(A.sources.to)}, dazu zwei Revisionsberichte</div>
      </div>
    </div>
    <div class="card">
      <h2>Gegenprüfung der Jahreszahlen</h2>
      <div class="sub2">Jede Mappe trägt die abgeschlossenen Vorjahre als eigenes Blatt mit.
      Damit liegt jedes Jahr in bis zu ${A.sources.books} Fassungen vor.</div>
      <div class="tw"><table>
        <thead><tr><th class="l">FJ</th><th>Debitoren</th><th>Reserven</th><th>Total</th><th class="l">Befund</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="note">${esc(A.checked.years)}. Es gibt keine einzige Abweichung.
      Die Zahlen der Fiskaljahre ${Y[0].year} bis ${Y[5].year} sind damit gegen die Mappen
      von damals geprüft und bestätigt.</div>
    </div>
    <div class="card">
      <h2>Was offen bleibt und was geklärt ist</h2>
      <div class="sub2">Ehrlich aufgelistet, damit die Übergabe stimmt.</div>
      ${open.map(o => {
        const col = o.s === "geklärt" ? "#7ee287" : o.s === "offen" ? "#ff9f43" : "#8fa3c4";
        return `<div class="step" style="border-left-color:${col}">
          <div class="sd" style="color:${col}">${esc(o.s)}</div>
          <div class="st">${esc(o.t)}</div>
          <div class="sv" style="line-height:1.5">${o.d}</div></div>`;
      }).join("")}
    </div>
    <div class="card">
      <h2>Die Vereinsjahre</h2>
      <div class="sub2">Aus dem Bussenjournal: erste und letzte Buchung je Blatt.
      Ein Vereinsjahr ist weder ein Kalenderjahr noch gleich lang wie das nächste.</div>
      <div class="tw"><table>
        <thead><tr><th class="l">FJ</th><th class="l">von</th><th class="l">bis</th><th>Termine</th><th>Tage</th></tr></thead>
        <tbody>${A.fiscalYears.map(f => {
          const days = Math.round((new Date(f.to) - new Date(f.from)) / 86400000);
          return `<tr>
            <td class="l" style="font-weight:700">${f.fy}</td>
            <td class="l" style="opacity:.85">${dmy(f.from)}</td>
            <td class="l" style="opacity:.85">${dmy(f.to)}</td>
            <td class="num">${f.meets}</td>
            <td class="num" style="opacity:.7">${days}</td>
          </tr>`;
        }).join("")}</tbody></table></div>
      <div class="note">Das Fiskaljahr ${Y[3].year} dauerte ${Math.round((new Date(A.fiscalYears[3].to) - new Date(A.fiscalYears[3].from)) / 86400000)} Tage,
      weil die Chlöpfete während der Pandemie mehrfach verschoben wurde. Das laufende Jahr
      ${cur.year} ist noch offen.</div>
    </div>`;
}

const coinName = (s) => {
  const m = s.match(/^(.*?)\s*\((.*)\)\s*$/);
  return m ? `${esc(m[1])}<span style="display:block;font-size:11px;opacity:.45">${esc(m[2])}</span>` : esc(s);
};

function renderAll() { renderOverview(); renderAlloc(); renderGold(); renderReturn(); renderSpend(); renderAudit(); }
renderAll();

// Live-Kurs nachladen und alles neu zeichnen, sobald er da ist
fetch("/api/gold", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
  .then(d => {
    if (!d || !(d.chfPerGram > 0) || !(d.chfPerOz > 0)) return;
    LIVE = d;
    renderAll();
  })
  .catch(() => { /* ohne Live-Kurs bleiben die Monatswerte stehen */ });
</script>
</body>
</html>
