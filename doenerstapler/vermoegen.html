<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c386d">
<title>Vereinsvermögen · Dönerfriitig</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { padding-bottom: 40px; }

  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(44,56,109,.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) 14px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar img { width: 38px; height: 38px; object-fit: contain; }
  .topbar .t { font-size: 17px; font-weight: 800; line-height: 1.1; }
  .topbar .s { font-size: 11px; opacity: .6; letter-spacing: 1.5px; text-transform: uppercase; }
  .topbar a.home {
    margin-left: auto; color: var(--cream); opacity: .75; text-decoration: none;
    font-size: 13px; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 11px;
  }

  /* Fuenf Reiter passen auf schmalen Geraeten nicht nebeneinander, darum
     schmalere Polster und ein angeschnittener letzter Reiter als Wischhinweis. */
  .tabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 12px 14px 4px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto; padding: 9px 12px; border-radius: 11px; font-size: 13.5px; font-weight: 700;
    background: var(--card); color: var(--cream); border: 2px solid transparent; cursor: pointer;
    white-space: nowrap;
  }
  .tabs button.on { border-color: var(--blue2); background: #1d2750; color: var(--blue2); }
  /* Der Pfeil zeigt an, dass sich unter dem Reiter noch etwas verbirgt. */
  .tabs button .caret { font-size: 10px; opacity: .55; margin-left: 4px; }

  /* Zweite Ebene: erscheint nur, wenn der zugehoerige Reiter offen ist. */
  .subtabs {
    display: flex; gap: 6px; align-items: center; overflow-x: auto;
    padding: 4px 14px 0; scrollbar-width: none;
    max-width: 760px; margin: 0 auto;
  }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtabs .lbl { font-size: 11px; opacity: .45; letter-spacing: .8px;
                  text-transform: uppercase; flex: 0 0 auto; padding-right: 2px; }
  .subtabs button {
    flex: 0 0 auto; padding: 6px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 700;
    background: transparent; color: var(--cream); cursor: pointer;
    border: 1.5px solid var(--line); white-space: nowrap; opacity: .8;
  }
  .subtabs button.on { border-color: #ffd166; color: #ffd166; background: rgba(255,209,102,.1); opacity: 1; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 8px 14px 0; }
  .panel { display: none; } .panel.on { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 3px; font-size: 17px; font-weight: 800; color: var(--cream); }
  .card .sub2 { font-size: 12px; opacity: .6; margin-bottom: 14px; line-height: 1.4; }

  .tw { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
  .tw::-webkit-scrollbar { height: 5px; }
  .tw::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 9px 5px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { padding-left: 0; }
  th:last-child, td:last-child { padding-right: 0; }
  th { font-size: 11px; opacity: .6; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
       border-bottom: 1px solid var(--line); }
  th.l, td.l { text-align: left; }
  .sn { display: block; font-size: 10.5px; opacity: .5; font-weight: 400; white-space: normal;
        max-width: 132px; line-height: 1.35; margin-top: 2px; }
  @media (min-width: 520px) { .sn { max-width: 260px; } }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,.06); }
  tbody tr:last-child { border-bottom: none; }
  td.num { font-variant-numeric: tabular-nums; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; display: inline-block; }

  .hero2 { text-align: center; padding: 4px 0 2px; }
  .hero2 .big { font-size: 42px; font-weight: 800; color: var(--blue2); line-height: 1.05;
                font-variant-numeric: tabular-nums; }
  .hero2 .cur { font-size: 15px; opacity: .5; font-weight: 700; }
  .hero2 .sub { font-size: 12px; opacity: .6; margin-top: 5px; }

  .live {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; padding: 3px 9px; border-radius: 20px;
    border: 1px solid rgba(126,226,135,.45); color: #7ee287; margin-top: 8px;
  }
  .live i { width: 6px; height: 6px; border-radius: 50%; background: #7ee287;
            animation: pulse 1.8s ease-in-out infinite; }
  .live.off { border-color: rgba(238,244,251,.2); color: rgba(238,244,251,.5); }
  .live.off i { background: rgba(238,244,251,.4); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 9px; }
  .kpi { background: #1d2750; border: 1px solid var(--line); border-radius: 13px; padding: 12px; }
  .kpi .v { font-size: 20px; font-weight: 800; color: var(--blue2); font-variant-numeric: tabular-nums; }
  .kpi .k { font-size: 11px; opacity: .62; margin-top: 2px; line-height: 1.35; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .chip {
    padding: 7px 13px; border-radius: 10px; font-size: 13px; font-weight: 700;
    background: #1d2750; color: var(--cream); border: 2px solid transparent; cursor: pointer;
  }
  .chip.on { border-color: var(--blue2); color: var(--blue2); }
  .chip.bench { font-size: 12px; padding: 6px 11px; opacity: .75; }
  .chip.bench.on { opacity: 1; }
  .chips .lbl { font-size: 11px; opacity: .45; letter-spacing: .8px; text-transform: uppercase;
                align-self: center; padding-right: 2px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .lg { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; }
  .lg span.i { display: flex; align-items: center; gap: 6px; opacity: .85; }

  .rec { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0;
         border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; }
  .rec:last-child { border-bottom: none; }
  .rec .r { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .note { font-size: 11.5px; opacity: .55; line-height: 1.5; margin-top: 10px; }
  .up { color: #4caf50; } .down { color: #ff6b8a; }

  .eras { display: grid; gap: 10px; }
  .era { display: flex; gap: 12px; align-items: flex-start; padding: 12px 13px;
         background: #1d2750; border: 1px solid var(--line); border-radius: 13px; }
  .era .bulb { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
  .era .y { font-size: 11px; opacity: .55; letter-spacing: .6px; text-transform: uppercase; }
  .era .n { font-size: 15px; font-weight: 800; }
  .era .d { font-size: 12px; opacity: .68; line-height: 1.45; margin-top: 3px; }

  .donutRow { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .donutRow svg { width: 176px; flex: 0 0 auto; }
  .donutRow .keys { flex: 1; min-width: 180px; }
  .keyrow { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 13.5px;
            border-bottom: 1px solid rgba(255,255,255,.06); }
  .keyrow:last-child { border-bottom: none; }
  .keyrow .kv { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .keyrow .kp { opacity: .5; font-size: 12px; min-width: 46px; text-align: right; }

  /* Zeitstrahl der Anlagereise */
  .steps { position: relative; padding-left: 22px; }
  .steps::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px;
                   width: 2px; background: rgba(255,255,255,.12); }
  .step { position: relative; padding: 9px 0; }
  .step::before { content: ""; position: absolute; left: -21px; top: 15px; width: 12px; height: 12px;
                  border-radius: 50%; background: var(--card); border: 2.5px solid var(--blue2); }
  .step.gold::before { border-color: #ffd166; }
  .step.crypto::before { border-color: #2ee6a8; }
  .step.now::before { border-color: #7ee287; background: #7ee287; }
  .step .sd { font-size: 11px; opacity: .5; letter-spacing: .5px; text-transform: uppercase; }
  .step .st { font-size: 14.5px; font-weight: 700; margin-top: 1px; }
  .step .sv { font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }

  @media (max-width: 439px) {
    table { font-size: 12.5px; }
    th, td { padding: 8px 4px; }
    .hero2 .big { font-size: 36px; }
    .donutRow { justify-content: center; }
  }
</style>
</head>
<body>
<div class="topbar">
  <img src="logo.png" alt="DF" onerror="this.style.display='none'">
  <div><div class="t">Vereinsvermögen</div><div class="s">Bilanz und Anlagen</div></div>
  <a class="home" href="index.html">Start</a>
</div>

<div class="tabs" id="tabs"></div>
<div class="subtabs" id="subtabs" hidden></div>
<div class="wrap">
  <div class="panel on" id="p-overview"></div>
  <div class="panel" id="p-alloc"></div>
  <div class="panel" id="p-gold"></div>
  <div class="panel" id="p-return"></div>
  <div class="panel" id="p-spend"></div>
</div>

<script src="df-data.js?v=202608141148"></script>
<!-- Der Versionsparameter holt bereits gecachte Kopien aus dem Weg. Das _headers
     im Wurzelverzeichnis regelt nur, was ab jetzt gecacht wird, es erreicht eine
     Kopie im Browser eines Mitglieds nicht mehr. Darum beides.
     Bei jeder Änderung an df-assets.js das Datum hier mitziehen. -->
<script src="df-assets.js?v=202608141148"></script>
<script>
const A = window.DF_ASSETS;
const D = window.DF_DATA;
const G = A.gold;
const OZ = 31.1034768;

const C = { deb: "#7cc4ff", gold: "#ffd166", crypto: "#2ee6a8", cash: "#8fa3c4", prov: "#b39dff" };
const kindCol = (k) => k === "Gold" ? C.gold : k === "Krypto" ? C.crypto : C.cash;

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chf = (v) => v.toLocaleString("de-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const chf0 = (v) => Math.round(v).toLocaleString("de-CH");
// Gramm sind keine Franken, hier braucht es die Nachkommastellen
const gr = (v) => v.toLocaleString("de-CH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct1 = (v) => (v * 100).toFixed(1).replace(".", ",") + " %";
const sig = (v, f) => (v >= 0 ? "+" : "−") + f(Math.abs(v));
const sigPct = (v) => sig(v, x => (x * 100).toFixed(1).replace(".", ",") + " %");
const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const mLabel = (m) => MON[+m.slice(5) - 1] + " " + m.slice(0, 4);
const dmy = (iso) => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };

const Y = A.years;
const cur = Y[Y.length - 1];
// Das Blatt 2026 rechnet die Reserve als Goldwert vom 05.12.2025 minus die Ausgaben
// des laufenden Jahres. Diese Differenz brauchen wir für den Marktwert.
const spent = Math.round((G.valuationChf - cur.reserves) * 100) / 100;

// ---------- Kurs: live wenn möglich, sonst der letzte Monatsdurchschnitt ----------
let LIVE = null;
function px() {
  if (LIVE) return { chfG: LIVE.chfPerGram, chfOz: LIVE.chfPerOz, live: true,
                     label: "Live-Kurs", ts: LIVE.ts, stale: !!LIVE.stale, source: LIVE.source };
  return { chfG: G.last.chfG, chfOz: G.last.chfOz, live: false,
           label: "Monatsdurchschnitt " + mLabel(G.last.m) };
}
const goldValue = () => G.xau * px().chfOz;
const marketValue = () => cur.debitors + goldValue() - spent;

function liveBadge() {
  const p = px();
  if (!p.live) return `<div class="live off"><i></i>${esc(p.label)}</div>`;
  const age = Math.round((Date.now() - p.ts) / 60000);
  return `<div class="live"><i></i>Live${p.stale ? ", letzter bekannter Kurs" : ""}${age > 1 ? ` · vor ${age} Min` : ""}</div>`;
}

// Interner Zinsfuss über die beiden Kryptoeinzahlungen und den heutigen Goldwert
function irr(endValue) {
  const flows = [[new Date(A.crypto.in1Date), -A.crypto.in1],
                 [new Date(A.crypto.in2Date), -A.crypto.in2]];
  const t0 = flows[0][0], end = new Date();
  const yrs = (d) => (d - t0) / (365.25 * 86400000);
  const npv = (r) => flows.reduce((s, [d, cf]) => s + cf / Math.pow(1 + r, yrs(d)), 0)
                     + endValue / Math.pow(1 + r, yrs(end));
  let lo = -0.95, hi = 5;
  for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (npv(m) > 0) lo = m; else hi = m; }
  return (lo + hi) / 2;
}

// ===================== Reiter =====================
// Gold hängt unter Allokation. Der Hauptreiter trägt darum einen Pfeil, und
// sobald er offen ist, erscheint darunter die zweite Ebene.
const TABS = [
  { id: "overview", label: "Übersicht" },
  { id: "alloc", label: "Allokation", kids: [["alloc", "Allokation"], ["gold", "Gold"]] },
  { id: "return", label: "Rendite" },
  { id: "spend", label: "Ausgaben" },
];
let mainTab = "overview", subTab = "alloc";

document.getElementById("tabs").innerHTML = TABS.map(t =>
  `<button data-t="${t.id}">${t.label}${t.kids ? '<span class="caret">▾</span>' : ""}</button>`).join("");

function paintTabs() {
  const cur = TABS.find(t => t.id === mainTab);
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === mainTab));
  const sub = document.getElementById("subtabs");
  if (cur.kids) {
    sub.hidden = false;
    sub.innerHTML = cur.kids.map(([id, l]) =>
      `<button data-s="${id}" class="${subTab === id ? "on" : ""}">${l}</button>`).join("");
  } else {
    sub.hidden = true; sub.innerHTML = "";
  }
  const shown = cur.kids ? subTab : mainTab;
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + shown));
}

document.getElementById("tabs").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  mainTab = b.dataset.t;
  const cur = TABS.find(t => t.id === mainTab);
  if (cur.kids) subTab = cur.kids[0][0];
  paintTabs();
  window.scrollTo({ top: 0, behavior: "smooth" });
};
document.getElementById("subtabs").onclick = (e) => {
  const b = e.target.closest("button"); if (!b) return;
  subTab = b.dataset.s; paintTabs();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

// ===================== Diagramme, von Hand als SVG =====================
function columnStack(rows, keys, colors, opts) {
  const o = Object.assign({ w: 680, h: 250, fmt: v => v, share: false }, opts || {});
  const { w, h } = o;
  const left = 44, right = w - 6, top = 22, bottom = h - 24;
  const tot = rows.map(r => keys.reduce((s, k) => s + (r.parts[k] || 0), 0));
  const max = o.share ? 1 : Math.max(...tot, 1) * 1.12;
  const step = (right - left) / rows.length;
  const bw = Math.min(38, step * 0.62);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = bottom - (bottom - top) * (i / 4);
    g += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    g += `<text x="${left - 6}" y="${y + 4}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="end">${o.share ? Math.round(v * 100) + "%" : chf0(v)}</text>`;
  }
  rows.forEach((r, i) => {
    const cx = left + step * (i + 0.5);
    const base = o.share ? (tot[i] || 1) : 1;
    const cols = r.colors || colors;
    let y = bottom;
    keys.forEach((k, ki) => {
      const v = (r.parts[k] || 0) / base; if (!v) return;
      const bh = (bottom - top) * (v / max);
      y -= bh;
      g += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(1, bh)}"
             fill="${cols[ki]}" ${ki === keys.length - 1 ? 'rx="3"' : ""}/>`;
    });
    if (!o.share) {
      // Wo eine eigene Kopfzahl gesetzt ist, markiert eine gestrichelte Linie ihre Höhe.
      // So sieht man auf einen Blick, wenn die Säule darüber hinausragt.
      const headVal = r.top === undefined ? tot[i] : r.top;
      const headY = bottom - (bottom - top) * (headVal / max);
      if (r.top !== undefined && Math.abs(r.top - tot[i]) > 0.5) {
        g += `<line x1="${cx - bw / 2 - 4}" y1="${headY.toFixed(1)}" x2="${cx + bw / 2 + 4}" y2="${headY.toFixed(1)}"
               stroke="rgba(238,244,251,.7)" stroke-width="1.4" stroke-dasharray="3 3"/>`;
      }
      g += `<text x="${cx}" y="${(Math.min(y, headY) - 6).toFixed(1)}"
             fill="rgba(238,244,251,.8)" font-size="10.5"
             text-anchor="middle" font-weight="700">${o.fmt(headVal)}</text>`;
    }
    g += `<text x="${cx}" y="${bottom + 15}" fill="rgba(238,244,251,.55)" font-size="10.5"
           text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

let gradSeq = 0;
function areaChart(pts, opts) {
  const o = Object.assign({ w: 680, h: 250, color: C.gold, yFmt: v => chf0(v),
                            marks: [], yMin: null, fill: true }, opts || {});
  const { w, h } = o;
  const left = 46, right = w - 8, top = 14, bottom = h - 26;
  const id = "ac" + (++gradSeq);
  const vals = pts.map(p => p.y);
  let max = Math.max(...vals), min = o.yMin !== null ? o.yMin : Math.min(...vals);
  const padY = (max - min) * 0.12 || 1;
  max += padY; if (o.yMin === null) min = Math.max(0, min - padY);
  const X = (i) => left + (right - left) * (pts.length > 1 ? i / (pts.length - 1) : 0.5);
  const Yv = (v) => bottom - (bottom - top) * ((v - min) / (max - min || 1));
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4, y = Yv(v);
    g += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    g += `<text x="${left - 6}" y="${y + 4}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="end">${o.yFmt(v)}</text>`;
  }
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Yv(p.y).toFixed(1)}`).join(" ");
  if (o.fill) {
    g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${o.color}" stop-opacity=".38"/>
      <stop offset="100%" stop-color="${o.color}" stop-opacity="0"/></linearGradient></defs>`;
    g += `<polygon points="${X(0)},${bottom} ${line} ${X(pts.length - 1)},${bottom}" fill="url(#${id})"/>`;
  }
  g += `<polyline points="${line}" fill="none" stroke="${o.color}" stroke-width="2.4"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  o.marks.forEach(mk => {
    const i = pts.findIndex(p => p.x === mk.at); if (i < 0) return;
    const x = X(i), y = Yv(pts[i].y);
    g += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="${mk.color || "#eef4fb"}"
           stroke-width="1.2" stroke-dasharray="3 4" opacity=".55"/>`;
    g += `<circle cx="${x}" cy="${y}" r="4.2" fill="${mk.color || "#eef4fb"}" stroke="#26315e" stroke-width="2"/>`;
    const anchor = i > pts.length * 0.62 ? "end" : "start";
    g += `<text x="${x + (anchor === "end" ? -6 : 6)}" y="${top + (mk.row || 0) * 13 + 9}"
           fill="${mk.color || "#eef4fb"}" font-size="10.5" font-weight="700"
           text-anchor="${anchor}">${esc(mk.label)}</text>`;
  });
  const short = pts.length <= 30;
  const every = Math.max(1, Math.round(pts.length / (short ? 5 : 6)));
  let lastLbl = null;
  pts.forEach((p, i) => {
    if (i % every && i !== pts.length - 1) return;
    const lbl = short ? mLabel(p.x).replace(" 20", " ") : p.x.slice(0, 4);
    if (lbl === lastLbl) return;
    lastLbl = lbl;
    g += `<text x="${X(i)}" y="${bottom + 16}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="middle">${esc(lbl)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

// ---------- Marktwert der Reserve zu einem beliebigen Datum ----------
// Bargeld bleibt Bargeld. Für Krypto zählen die in den Mappen erfassten Stände,
// dazwischen wird linear verbunden. Der Bitcoinzukauf ist frisches Geld und
// darf nicht als Kursgewinn erscheinen, deshalb steht er als Stufe drin.
// Ab dem Umtausch zählt die Goldposition zum Monatskurs.
const RESERVE_MARKS = (() => {
  const K = A.crypto;
  const markt = K.marks.filter(m => m.kind !== "einstand");
  const out = markt.map(m => ({ d: m.d, v: m.chf }));
  const davor = markt.filter(m => m.d < K.in2Date).pop();
  if (davor) out.push({ d: K.in2Date, v: davor.chf + K.in2 });
  G.series.forEach(s => { if (s.m + "-15" > K.outDate) out.push({ d: s.m + "-15", v: G.xau * s.chfOz }); });
  return out.sort((a, b) => a.d < b.d ? -1 : 1);
})();

function reserveMarketAt(d) {
  const P = RESERVE_MARKS;
  const p = px();
  const last = p.live ? { d: "9999-12-31", v: G.xau * p.chfOz } : P[P.length - 1];
  if (d <= P[0].d) return P[0].v;
  for (let i = 1; i < P.length; i++) {
    if (d <= P[i].d) {
      const a = P[i - 1], b = P[i];
      const t = (new Date(d) - new Date(a.d)) / ((new Date(b.d) - new Date(a.d)) || 1);
      return a.v + (b.v - a.v) * t;
    }
  }
  return last.v;
}

function reserveAt(fy, d, mode) {
  const y = Y.find(x => x.year === fy);
  const buch = y.reserves || 0;
  if (mode === "buch" || !buch || y.reserveKind === "Bargeld") return buch;
  return reserveMarketAt(d);
}

// Jeder gebuchte Bussentermin ergibt einen Punkt: aufgelaufene Debitoren plus Reserve.
function wealthPoints(mode) {
  const pts = [];
  A.fiscalYears.forEach(f => {
    const rows = A.ledger[f.fy] || [];
    rows.forEach(([d, deb], i) => {
      pts.push({ d, v: deb + reserveAt(f.fy, d, mode), close: i === rows.length - 1 });
    });
  });
  return pts.sort((a, b) => a.d < b.d ? -1 : 1);
}

// Verlauf auf einer echten Zeitachse. Die Termine liegen unregelmässig,
// deshalb wird nach Datum positioniert und nicht nach Position in der Liste.
function timeChart(pts, opts) {
  const o = Object.assign({ w: 680, h: 260, bands: [], dots: [], yFmt: v => chf0(v) }, opts || {});
  const { w, h } = o;
  const left = 48, right = w - 8, top = 16, bottom = h - 30;
  const T = (d) => new Date(d).getTime();
  const t0 = T(pts[0].d), t1 = T(pts[pts.length - 1].d);
  const X = (d) => left + (right - left) * ((T(d) - t0) / (t1 - t0 || 1));
  const max = Math.max(...pts.map(p => p.v)) * 1.1;
  const Yv = (v) => bottom - (bottom - top) * (v / max);
  let g = "";
  o.bands.forEach(b => {
    g += `<rect x="${X(b.from).toFixed(1)}" y="${top}"
           width="${Math.max(0, X(b.to) - X(b.from)).toFixed(1)}" height="${bottom - top}"
           fill="${b.color}" opacity=".07"/>`;
  });
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = Yv(v);
    g += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    g += `<text x="${left - 6}" y="${y + 4}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="end">${o.yFmt(v)}</text>`;
  }
  const line = pts.map(p => `${X(p.d).toFixed(1)},${Yv(p.v).toFixed(1)}`).join(" ");
  g += `<polyline points="${line}" fill="none" stroke="${C.deb}" stroke-width="2.2"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  // Bei rund 400 Terminen wuerde ein Punkt je Termin die Linie zukleistern,
  // deshalb bekommen nur die Jahresabschluesse eine Markierung.
  pts.forEach(p => {
    if (!p.close) return;
    g += `<circle cx="${X(p.d).toFixed(1)}" cy="${Yv(p.v).toFixed(1)}" r="4.2"
           fill="${C.gold}" stroke="#26315e" stroke-width="1.6">
           <title>${esc(dmy(p.d))}: CHF ${chf0(p.v)}</title></circle>`;
  });
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear();
  for (let y = y0; y <= y1; y++) {
    const d = `${y}-01-01`; if (T(d) < t0 || T(d) > t1) continue;
    g += `<line x1="${X(d).toFixed(1)}" y1="${top}" x2="${X(d).toFixed(1)}" y2="${bottom}"
           stroke="rgba(255,255,255,.07)"/>`;
    g += `<text x="${X(d).toFixed(1)}" y="${bottom + 16}" fill="rgba(238,244,251,.5)"
           font-size="10.5" text-anchor="middle">${y}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

function donut(parts) {
  const R = 62, r = 38, cx = 76, cy = 76;
  const tot = parts.reduce((s, p) => s + p.value, 0) || 1;
  let a0 = -Math.PI / 2, g = "";
  parts.forEach(p => {
    const a1 = a0 + 2 * Math.PI * (p.value / tot);
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const P = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)},${(cy + rad * Math.sin(a)).toFixed(2)}`;
    g += `<path d="M ${P(R, a0)} A ${R} ${R} 0 ${big} 1 ${P(R, a1)} L ${P(r, a1)}
           A ${r} ${r} 0 ${big} 0 ${P(r, a0)} Z" fill="${p.color}"/>`;
    a0 = a1;
  });
  g += `<text x="${cx}" y="${cy - 2}" text-anchor="middle" fill="#eef4fb" font-size="17"
         font-weight="800">${chf0(tot)}</text>`;
  g += `<text x="${cx}" y="${cy + 14}" text-anchor="middle" fill="rgba(238,244,251,.5)"
         font-size="10.5">CHF total</text>`;
  return `<svg viewBox="0 0 152 152" role="img">${g}</svg>`;
}

// Monatsreihe plus, falls vorhanden, der Live-Kurs als zusätzlicher Punkt
function goldPoints() {
  const s = G.series.map(p => ({ x: p.m, y: p.chfG, oz: p.chfOz }));
  const p = px();
  if (p.live) {
    const now = new Date();
    const m = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    if (m > G.last.m) s.push({ x: m, y: p.chfG, oz: p.chfOz });
    else s[s.length - 1] = { x: m, y: p.chfG, oz: p.chfOz };
  }
  return s;
}

// Wertreihe der Anlage: bis zum Umtausch die erfassten Kryptostaende,
// danach die Goldposition zum jeweiligen Monatskurs.
function returnPoints() {
  const K = A.crypto;
  const invested = (d) => d < K.in2Date ? K.in1 : K.totalIn;
  // Der Kauftag selbst ist der Nullpunkt, sonst startet die Kurve im Nichts
  const raw = [{ d: K.in1Date, v: K.in1 }]
    .concat(K.marks.filter(m => m.kind !== "einstand").map(m => ({ d: m.d, v: m.chf })));
  G.series.forEach(s => { if (s.m + "-28" > K.outDate) raw.push({ d: s.m + "-28", v: G.xau * s.chfOz }); });
  const p = px();
  if (p.live) raw.push({ d: new Date().toISOString().slice(0, 10), v: G.xau * p.chfOz });
  raw.sort((a, b) => a.d < b.d ? -1 : 1);
  return raw.map(x => ({ d: x.d, v: x.v, r: x.v / invested(x.d) - 1, g: x.v - invested(x.d) }));
}


// ---------- Vergleichsindizes ----------
// Damit der Vergleich etwas taugt, bekommt jeder Index dieselben Einzahlungen
// zu denselben Zeitpunkten wie der Verein. Sonst vergleicht man eine Einmalanlage
// mit einer, die zweimal Geld nachgeschossen hat.
const BENCH = { smi: { name: "SMI", color: "#ff6b8a" },
                dax: { name: "DAX", color: "#7cc4ff" },
                spx: { name: "S&P 500", color: "#b39dff" } };
let benchLive = null;

function benchSeries(key) {
  const live = benchLive && benchLive.series && benchLive.series[key];
  return (live && live.length > 6) ? live : (A.bench[key] ? A.bench[key].series : []);
}

function benchPoints(key) {
  const K = A.crypto, rows = benchSeries(key);
  if (!rows.length) return [];
  const idx = Object.fromEntries(rows);
  const m0 = rows[0][0], m2 = K.in2Date.slice(0, 7);
  if (!idx[m0] || !idx[m2]) return [];
  return rows.map(([m, v]) => {
    const eingezahlt = m < m2 ? K.in1 : K.totalIn;
    let wert = K.in1 * v / idx[m0];
    if (m >= m2) wert += K.in2 * v / idx[m2];
    return { d: m + "-28", v: wert, r: wert / eingezahlt - 1, g: wert - eingezahlt };
  });
}

// Der Endpunkt liefert dieselben Reihen frisch. Klappt er nicht, bleibt es beim
// mitgelieferten Stand, genau wie beim Goldkurs.
async function loadBench() {
  try {
    const res = await fetch("/api/bench", { cache: "no-store" });
    if (!res.ok) return;
    const d = await res.json();
    if (d && d.series && Array.isArray(d.series.smi) && d.series.smi.length > 6) {
      benchLive = d;
      renderReturn();
    }
  } catch { /* dann eben der mitgelieferte Stand */ }
}

function returnChart(pts, opts) {
  const o = Object.assign({ w: 680, h: 260, marks: [], mode: "pct" }, opts || {});
  const { w, h } = o;
  const pct = o.mode === "pct";
  const val = (p) => pct ? p.r : p.g;
  const fmtY = (v) => pct ? Math.round(v * 100) + "%" : chf0(v);
  const left = pct ? 46 : 54, right = w - 8, top = 16, bottom = h - 30;
  const T = (d) => new Date(d).getTime();
  const t0 = T(pts[0].d), t1 = T(pts[pts.length - 1].d);
  const X = (d) => left + (right - left) * ((T(d) - t0) / (t1 - t0 || 1));
  const extra = (o.series || []).filter(x => x.pts.length);
  const vals = pts.map(val).concat(...extra.map(x => x.pts.map(val)));
  let lo = Math.min(0, ...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.12 || (pct ? 0.1 : 100);
  lo -= pad; hi += pad;
  const Yv = (v) => bottom - (bottom - top) * ((v - lo) / (hi - lo));
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Yv(v);
    g += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`;
    g += `<text x="${left - 6}" y="${y + 4}" fill="rgba(238,244,251,.5)" font-size="10.5"
           text-anchor="end">${fmtY(v)}</text>`;
  }
  const zy = Yv(0);
  g += `<line x1="${left}" y1="${zy}" x2="${right}" y2="${zy}" stroke="rgba(238,244,251,.4)" stroke-width="1.2"/>`;
  const id = "rc" + (++gradSeq);
  const line = pts.map(p => `${X(p.d).toFixed(1)},${Yv(val(p)).toFixed(1)}`).join(" ");
  g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7ee287" stop-opacity=".4"/>
    <stop offset="100%" stop-color="#7ee287" stop-opacity="0"/></linearGradient>
    <clipPath id="${id}c"><rect x="${left}" y="${top}" width="${right - left}" height="${Math.max(0, zy - top)}"/></clipPath></defs>`;
  g += `<polygon points="${X(pts[0].d)},${zy} ${line} ${X(pts[pts.length - 1].d)},${zy}"
         fill="url(#${id})" clip-path="url(#${id}c)"/>`;
  extra.forEach(x => {
    const l = x.pts.filter(p => T(p.d) >= t0 && T(p.d) <= t1)
                   .map(p => `${X(p.d).toFixed(1)},${Yv(val(p)).toFixed(1)}`).join(" ");
    if (l) g += `<polyline points="${l}" fill="none" stroke="${x.color}" stroke-width="1.8"
                  stroke-dasharray="5 3" stroke-linejoin="round" opacity=".9"/>`;
  });
  g += `<polyline points="${line}" fill="none" stroke="#7ee287" stroke-width="2.8"
         stroke-linejoin="round" stroke-linecap="round"/>`;
  o.marks.forEach(mk => {
    const x = X(mk.d);
    g += `<line x1="${x.toFixed(1)}" y1="${top}" x2="${x.toFixed(1)}" y2="${bottom}"
           stroke="${mk.color}" stroke-width="1.2" stroke-dasharray="3 4" opacity=".6"/>`;
    const anchor = X(mk.d) > (left + right) * 0.6 ? "end" : "start";
    g += `<text x="${(x + (anchor === "end" ? -6 : 6)).toFixed(1)}" y="${top + 10 + (mk.row || 0) * 13}"
           fill="${mk.color}" font-size="10.5" font-weight="700" text-anchor="${anchor}">${esc(mk.label)}</text>`;
  });
  const last = pts[pts.length - 1];
  g += `<circle cx="${X(last.d).toFixed(1)}" cy="${Yv(val(last)).toFixed(1)}" r="4.4"
         fill="#7ee287" stroke="#26315e" stroke-width="2"/>`;
  const y0 = new Date(t0).getFullYear(), y1 = new Date(t1).getFullYear();
  for (let y = y0; y <= y1; y++) {
    const d = `${y}-01-01`; if (T(d) < t0 || T(d) > t1) continue;
    g += `<text x="${X(d).toFixed(1)}" y="${bottom + 16}" fill="rgba(238,244,251,.5)"
           font-size="10.5" text-anchor="middle">${y}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}

let returnMode = "pct";
let benchOn = { smi: false, dax: false, spx: false };

function renderReturn() {
  const K = A.crypto;
  const goldNow = goldValue();
  const mult = goldNow / K.totalIn;
  const r = irr(goldNow);
  const RP = returnPoints();
  const pct = returnMode === "pct";
  const key = pct ? "r" : "g";
  const best = RP.reduce((a, b) => b[key] > a[key] ? b : a);
  const worst = RP.reduce((a, b) => b[key] < a[key] ? b : a);
  const fmt = (p) => pct ? sigPct(p.r) : sig(p.g, chf0);

  // Vergleich nur in der Prozentansicht, dort ist er aussagekräftig
  const gewaehlt = pct ? Object.keys(BENCH).filter(k => benchOn[k]) : [];
  const linien = gewaehlt.map(k => ({ ...BENCH[k], key: k, pts: benchPoints(k) }))
                         .filter(x => x.pts.length);

  const vergleich = linien.map(x => {
    const letzte = x.pts[x.pts.length - 1];
    const delta = RP[RP.length - 1].r - letzte.r;
    return `<div class="rec">
      <span><span class="dot" style="background:${x.color}"></span>&nbsp;${esc(x.name)}
        <span style="opacity:.5">&nbsp;dieselben Einzahlungen ergäben CHF ${chf0(letzte.v)}</span></span>
      <span class="r"><b style="color:${delta >= 0 ? "#7ee287" : "#ff6b8a"}">${sig(delta, v => Math.round(v * 100) + " Pp")}</b>
        <span style="opacity:.5">&nbsp;${sigPct(letzte.r)}</span></span></div>`;
  }).join("");

  document.getElementById("p-return").innerHTML = `
    <div class="card">
      <div class="hero2">
        <div class="cur">Aus CHF ${chf0(K.totalIn)} wurden</div>
        <div class="big" style="color:#7ee287">${chf0(goldNow)}</div>
        ${liveBadge()}
      </div>
    </div>
    <div class="card">
      <div class="kpis">
        <div class="kpi"><div class="v" style="color:#7ee287">${sig(goldNow - K.totalIn, chf0)}</div><div class="k">CHF Gewinn</div></div>
        <div class="kpi"><div class="v" style="color:#7ee287">${mult.toFixed(2).replace(".", ",")}×</div><div class="k">Multiple auf den Einsatz</div></div>
        <div class="kpi"><div class="v" style="color:#7ee287">${sigPct(mult - 1)}</div><div class="k">Gesamtrendite</div></div>
        <div class="kpi"><div class="v" style="color:#7ee287">${sigPct(r)}</div><div class="k">pro Jahr, interner Zinsfuss</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Rendite über die Zeit</h2>
      <div class="chips" id="returnChips">
        ${[["pct", "in Prozent"], ["chf", "in Franken"]]
          .map(([k, l]) => `<button class="chip ${returnMode === k ? "on" : ""}" data-m="${k}">${l}</button>`).join("")}
      </div>
      ${pct ? `<div class="chips" id="benchChips">
        <span class="lbl">Vergleich</span>
        ${Object.entries(BENCH).map(([k, b]) => `<button class="chip bench ${benchOn[k] ? "on" : ""}"
          data-b="${k}" style="${benchOn[k] ? `border-color:${b.color};color:${b.color}` : ""}">${b.name}</button>`).join("")}
      </div>` : ""}
      ${returnChart(RP, { mode: returnMode, series: linien, marks: [
        { d: K.in1Date, label: "Kauf der Shitcoins", color: C.crypto },
        { d: K.in2Date, label: "Bitcoin dazu", color: C.deb, row: 1 },
        { d: K.outDate, label: "Umtausch in Gold", color: C.gold, row: 2 },
      ] })}
      <div class="lg">
        <span class="i"><span class="dot" style="background:#7ee287"></span>Dönerfriitig</span>
        <span class="i">Höchststand ${fmt(best)} im ${mLabel(best.d.slice(0, 7))}</span>
        <span class="i">Tiefststand ${fmt(worst)} im ${mLabel(worst.d.slice(0, 7))}</span>
      </div>
      ${vergleich ? `<div style="margin-top:14px">${vergleich}</div>` : ""}
    </div>`;

  document.getElementById("returnChips").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    returnMode = b.dataset.m; renderReturn();
  };
  const bc = document.getElementById("benchChips");
  if (bc) bc.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    benchOn[b.dataset.b] = !benchOn[b.dataset.b]; renderReturn();
  };
}

// ===================== Ausgaben =====================
function renderSpend() {
  const S = A.spending;
  const avg = A.spentTotal / S.length;
  const collected = S.reduce((s, x) => s + x.collected, 0);
  const toRes = S.reduce((s, x) => s + x.toReserve, 0);

  const COL = { bussen: "#ff9f43", reserve: "#ff6b8a", spar: C.gold };
  const rows = S.map(x => {
    const fromRes = Math.max(0, x.spent - x.collected);
    return {
      label: String(x.year).slice(2),
      parts: { bussen: x.spent - fromRes, reserve: fromRes, spar: Math.max(0, x.toReserve) },
      colors: [COL.bussen, COL.reserve, COL.spar],
      top: x.collected,
    };
  });

  const table = S.map(x => {
    const fromRes = Math.max(0, x.spent - x.collected);
    return `<tr>
      <td class="l" style="font-weight:700">${x.year}</td>
      <td class="num">${chf0(x.collected)}</td>
      <td class="num" style="font-weight:800;color:${COL.bussen}">${chf0(x.spent)}</td>
      <td class="num ${x.toReserve >= 0 ? "up" : "down"}">${sig(x.toReserve, chf0)}</td>
      <td class="num" style="opacity:.7">${pct1(x.spent / x.collected)}</td>
    </tr>`;
  }).join("");

  document.getElementById("p-spend").innerHTML = `
    <div class="card">
      <div class="hero2">
        <div class="cur">CHF in Anlässe geflossen</div>
        <div class="big" style="color:${COL.bussen}">${chf0(A.spentTotal)}</div>
        <div class="sub">seit dem Fiskaljahr ${S[0].year}, im Schnitt ${chf0(avg)} pro Vereinsjahr</div>
      </div>
    </div>
    <div class="card">
      <h2>Einnahmen gegen Ausgaben</h2>
      <div class="sub2">Die Zahl über jeder Säule ist, was in dem Jahr an Bussen einkassiert wurde.</div>
      ${columnStack(rows, ["bussen", "reserve", "spar"],
                    [COL.bussen, COL.reserve, COL.spar], { fmt: v => chf0(v) })}
      <div class="lg">
        <span class="i"><span class="dot" style="background:${COL.bussen}"></span>Anlässe, aus Bussen bezahlt</span>
        <span class="i"><span class="dot" style="background:${COL.reserve}"></span>Anlässe, aus der Reserve bezahlt</span>
        <span class="i"><span class="dot" style="background:${COL.spar}"></span>in die Reserve gelegt</span>
      </div>
    </div>
    <div class="card">
      <h2>Zahlen je Vereinsjahr</h2>
      <div class="tw"><table>
        <thead><tr><th class="l">Fiskaljahr</th><th>Einkassiert</th><th>Anlässe</th>
          <th>In Reserve</th><th>Quote</th></tr></thead>
        <tbody>${table}</tbody>
        <tfoot><tr style="border-top:1px solid var(--line)">
          <td class="l" style="font-weight:800">Total</td>
          <td class="num" style="font-weight:800">${chf0(collected)}</td>
          <td class="num" style="font-weight:800;color:${COL.bussen}">${chf0(A.spentTotal)}</td>
          <td class="num" style="font-weight:800">${sig(toRes, chf0)}</td>
          <td class="num" style="font-weight:800">${pct1(A.spentTotal / collected)}</td>
        </tr></tfoot></table></div>
    </div>`;
}

// Jeder Reiter wird einzeln abgesichert. Passen Seite und Datensatz einmal nicht
// zusammen, etwa weil ein Browser noch eine alte df-assets.js hält, bleibt so
// nicht die ganze Seite leer, sondern nur der betroffene Reiter meldet sich.
function renderAll() {
  [["p-overview", renderOverview], ["p-alloc", renderAlloc], ["p-gold", renderGold],
   ["p-return", renderReturn], ["p-spend", renderSpend]].forEach(([id, fn]) => {
    try {
      fn();
    } catch (e) {
      document.getElementById(id).innerHTML =
        `<div class="card"><h2>Daten noch nicht geladen</h2>
         <div class="sub2">Bitte die Seite neu laden. Hält das an, meldet euch beim Statistiker.</div>
         <div class="note">${esc(String(e && e.message || e))}</div></div>`;
    }
  });
  paintTabs();
}
renderAll();
loadBench();

// Live-Kurs nachladen und alles neu zeichnen, sobald er da ist
fetch("/api/gold", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
  .then(d => {
    if (!d || !(d.chfPerGram > 0) || !(d.chfPerOz > 0)) return;
    LIVE = d;
    renderAll();
  })
  .catch(() => { /* ohne Live-Kurs bleiben die Monatswerte stehen */ });
</script>
